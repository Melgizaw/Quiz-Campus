    },
    pause(){ if (status === 'playing') halt('paused'); },     // answered or time up
    stop(){ if (bus || status !== 'off') halt(prefs().on ? 'stopped' : 'off'); session = null; },   // results or exit: the session ends
    position(){ return session ? (status === 'playing' && src ? startOffset + (ctx.currentTime - startedAt) : session.offset) : 0; },
    setVolume(v){ prefs().vol = v; if (master) master.gain.setTargetAtTime(v * .6, ctx.currentTime, .05); },
    state(){ return { status, track, files:fileOK }; },
  };
})();

/* Weekly / all-time / course boards, computed from the learner's real XP. */
function board(period){
  const me = { ...personOf('me'), xp: period === 'All time' ? S.lp.xpTotal : S.lp.weekXp };
  let rows = PEOPLE.filter(p => !p.me).map(p => ({ ...p, xp: period === 'All time' ? Math.round(p.xp * (2.1 + (p.pid.length % 3) * .3)) : p.xp }));
  if (period === 'HSC 310') rows = rows.filter(p => p.detail.startsWith('Health')).map(p => ({ ...p, xp:Math.round(p.xp * .45) }));
  if (period === 'HSC 310') me.xp = Math.round(S.lp.weekXp * .8);
  return [...rows, me].sort((a, b) => b.xp - a.xp);
}
const avatarOf = p => p.me ? 'MA' : initials(p.name);
const lbRow = (p, i, opts = {}) => {
  const hiddenMe = p.me && !S.lp.rankPublic;
  return `<div class="lb-row ${p.me ? 'me' : ''}"><span class="rk">${i + 1}</span><span class="avatar" style="--av:${p.av};border-color:#fff">${avatarOf(p)}</span><span style="min-width:0"><span class="nm">${p.me ? (hiddenMe ? 'You · hidden from others' : 'You') : esc(p.name)}</span><span class="dt">${hiddenMe ? 'Only you can see this row' : esc(p.detail)}</span></span>${!opts.points && i < 3 ? `<span class="crown" style="--c:${['#FFCC00','#B8C2D9','#FF8A3D'][i]}" aria-label="Rank ${i + 1}">${ic('award', 'ico-sm')}</span>` : `<span class="pts num">${fmt(p.xp)} XP</span>`}</div>`;
};
function weakestTarget(){
  const cands = [];
  for (const cid of ENROLLED) for (const [id, name, m, ev] of outcomesOf(cid)) { const n = pool(cid, id).length; if (n && ev) cands.push({ cid, id, name, m, n }); }
  return cands.sort((a, b) => a.m - b.m)[0];
}
function myRank(){ const b = board('Weekly'); return b.findIndex(p => p.me) + 1; }

/* ------------------------------------------------- Adaptive quiz engine
   Pools never fall back to unrelated courses (audit F06). Sessions shrink to
   the approved pool and say so. Attempts are resumable (audit F21). */
const MODE_N = { ai:6, quick:5, course:6, outcome:4 };
const MODE_NAME = { ai:'Match vs Athena', quick:'Quick 5', course:'Course practice', outcome:'Targeted review', challenge:'Peer challenge' };
function shuffleArr(a){ for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function startQuiz(mode, course, lo, cid){
  stopQuizTimer(); Music.stop();
  let items, opp = null, n, notice = '';
  if (mode === 'challenge'){
    const ch = INCOMING_CHALLENGES.find(c => c.cid === cid); course = ch.course;
    items = pool(ch.course).sort((a, b) => a.id.localeCompare(b.id)).slice(0, ch.n);
    opp = { kind:'peer', pid:ch.from, name:personOf(ch.from).name, av:personOf(ch.from).av, lvl:personOf(ch.from).lvl, pattern:ch.pattern, times:ch.times, cid };
  } else {
    items = mode === 'ai' || mode === 'quick' ? enrolledPool() : pool(course, mode === 'outcome' ? lo : null);
    items = shuffleArr(items.slice());
    if (mode === 'ai') opp = { kind:'ai', name:'Athena', lvl:5 };
  }
  const want = mode === 'challenge' ? items.length : MODE_N[mode];
  n = Math.min(want, items.length);
  if (n < want && mode !== 'challenge') notice = `${n} approved question${n === 1 ? '' : 's'} ${mode === 'outcome' ? 'exist for ' + lo : 'are available in this course'} right now, so this session has ${n}.`;
  S.quiz = { aid:'att_' + nextSeq('attempt'), mode, course: course || null, lo: lo || null, opp, n, i:0, diff: mode === 'ai' ? 3 : 2,
    poolUids: items.map(x => x.uid), used:[], history:[], correct:0, score:0, oppScore:0, notice, done:false };
  S.modal = null; S.lp.resume = null; save.lp();
  if (n) nextQuestion(true);
  nav('quiz');
}
function pickNext(qz){
  const cands = qz.poolUids.filter(u => !qz.used.includes(u)).map(itemByUid).filter(Boolean);
  if (qz.mode === 'challenge') return cands[0];
  return cands.map((it, k) => [it, k]).sort((a, b) => Math.abs(a[0].diff - qz.diff) - Math.abs(b[0].diff - qz.diff) || a[1] - b[1])[0]?.[0];
}
function nextQuestion(first){
  const qz = S.quiz; if (!first) qz.i++;
  if (qz.i >= qz.n){ finishQuiz(); return; }
  const q = pickNext(qz); if (!q){ finishQuiz(); return; }
  Object.assign(qz, { cur:q.uid, answered:false, hint:false, oppOk:null, timedOut:false, warned:false });
  qz.used.push(q.uid);
  Music.play();                                   // the session's track, from where it paused
  qz.sel = q.type === 'order' ? (() => { const a = shuffleArr(q.options.map((_, i) => i)); if (a.every((v, i) => v === i)) [a[0], a[1]] = [a[1], a[0]]; return a; })() : [];
  startQuestionClock();
}
function startQuestionClock(){
  const qz = S.quiz; stopQuizTimer();
  qz.limit = qTime(); qz.t0 = Date.now();
  if (!qz.limit) return;
  qz.timer = setTimeout(() => { if (!qz.answered){ qz.timedOut = true; submitAnswer(); } }, qz.limit * 1000);
  qz.tick = setInterval(() => {
    const left = Math.max(0, Math.ceil(qz.limit - (Date.now() - qz.t0) / 1000));
    const el = document.getElementById('q-left'); if (el) el.textContent = left;
    if (left <= 10 && !qz.warned){ qz.warned = true; announce(`10 seconds left`); }
  }, 250);
}
function stopQuizTimer(){ const qz = S.quiz; if (!qz) return; clearTimeout(qz.timer); clearInterval(qz.tick); qz.timer = null; qz.tick = null; }
function announce(msg){ const el = document.getElementById('sr-live'); if (el){ el.textContent = ''; setTimeout(() => { el.textContent = msg; }, 30); } }
function leaveQuiz(){
  const qz = S.quiz; if (!qz) return; stopQuizTimer(); Music.stop();
  if (!qz.done && qz.n && (qz.i > 0 || qz.answered)){
    const { timer, tick, ...rest } = qz; S.lp.resume = clone(rest); save.lp();
    setTimeout(() => toast('Progress saved. Resume it from Home.'), 0);
  }
  S.quiz = null;
}
function resumeQuiz(){
  const r = S.lp.resume; if (!r) return;
  S.quiz = clone(r); S.lp.resume = null; save.lp();
  if (!S.quiz.answered) startQuestionClock();
  Music.play();
  S.quiz.notice = (S.quiz.notice ? S.quiz.notice + ' ' : '') + 'Resumed where you left off. The clock restarted for this question.';
  nav('quiz');
}
function submitAnswer(){
  const qz = S.quiz, q = itemByUid(qz.cur); if (qz.answered) return; stopQuizTimer();
  const given = q.type === 'multi' ? [...qz.sel].sort((a, b) => a - b) : qz.sel;
  const ok = !qz.timedOut && JSON.stringify(given) === JSON.stringify(q.answer);
  const elapsed = (Date.now() - qz.t0) / 1000;
  const speed = qz.limit ? Math.max(0, Math.round(50 * (1 - elapsed / qz.limit))) : 0;
  const pts = ok ? 100 + speed - (qz.hint ? 25 : 0) : 0;
  Object.assign(qz, { answered:true, ok, pts }); qz.score += pts; if (ok) qz.correct++;
  let oppPts = 0;
  if (qz.opp?.kind === 'ai'){               // rubber-banded success probability (spec §7.2), scripted, not reasoning
    const lead = (qz.score - qz.oppScore) / 100;
    const p = clamp(.62 - .07 * (q.diff - 3) + .08 * lead, .25, .85);
    qz.oppOk = Math.random() < p; oppPts = qz.oppOk ? 100 + Math.round(Math.random() * 40) : 0;
  } else if (qz.opp?.kind === 'peer'){
    qz.oppOk = !!qz.opp.pattern[qz.i]; oppPts = qz.oppOk ? 100 + Math.max(0, Math.round(50 * (1 - qz.opp.times[qz.i] / 30))) : 0;
  }
  qz.oppScore += oppPts;
  qz.prevDiff = qz.diff; if (qz.mode !== 'challenge') qz.diff = clamp(qz.diff + (ok ? 1 : -1), 1, 5);
  qz.history.push({ uid:q.uid, id:q.id, ver:q.ver, course:q.course, lo:q.lo, bloom:q.bloom, diff:q.diff, ok, expired:qz.timedOut, hint:qz.hint, pts, oppOk:qz.oppOk, oppPts, secs:Math.round(elapsed) });
  announce(qz.timedOut ? 'Time is up.' : ok ? `Correct. Plus ${pts} XP.` : 'Not quite.');
  S.focusNext = '#fb';
  render();
}
/* Applies mastery, XP and badges exactly once per attempt (audit F09). */
function finishQuiz(){
  const qz = S.quiz; qz.done = true; stopQuizTimer(); Music.stop();
  if (qz.applied) return; qz.applied = true;
  const before = {}, after = {};
  for (const h of qz.history){
    const k = `${h.course}|${h.lo}`, rec = (S.lp.mastery[h.course] ||= {})[h.lo] ||= { m:0, ev:0 };
    if (!(k in before)) before[k] = rec.m;
    if (h.expired) continue;                                      // not evidence
    rec.m = masteryStep(rec.m, rec.ev, h.ok, h.diff, h.hint); rec.ev++; after[k] = rec.m;
  }
  const finish = qz.history.length === qz.n && qz.n ? 40 : 0;
  const result = qz.opp ? (qz.score > qz.oppScore ? 'Won' : qz.score < qz.oppScore ? 'Lost' : 'Draw') : null;
  const victory = result === 'Won' ? 100 : 0, mult = 1;
  const total = Math.round((qz.score + finish + victory) * mult);
  const lvBefore = levelOf(S.lp.xpTotal);
  S.lp.xpTotal += total; S.lp.weekXp += total; S.lp.weekSets = (S.lp.weekSets ?? 3) + 1;
  const seen = new Set(S.lp.seen || []); const fresh = qz.history.filter(h => !seen.has(h.id)).length; qz.history.forEach(h => seen.add(h.id)); S.lp.seen = [...seen];
  const newBadges = [];
  const award = k => { if (!S.lp.badges[k]){ S.lp.badges[k] = true; newBadges.push(k); } };
  if (qz.opp?.kind === 'ai' && result === 'Won' && qz.n >= 4) award('tamer');
  if (qz.opp?.kind === 'peer') { award('duel'); S.lp.done[qz.opp.cid] = { result, me:qz.score, opp:qz.oppScore }; }
  if (qz.score > S.lp.best) S.lp.best = qz.score;
  S.lp.attempts.unshift({ aid:qz.aid, mode:qz.mode, at:Date.now(), n:qz.n, correct:qz.correct, xp:total, items:qz.history.map(h => h.id + ' v' + h.ver) }); S.lp.attempts = S.lp.attempts.slice(0, 30);
  qz.summary = { before, after, finish, victory, mult, total, result, lvBefore, lvAfter:levelOf(S.lp.xpTotal), fresh, newBadges, seenCount:S.lp.seen.length };
  save.lp();
}

/* ------------------------------------------------------------- quiz view */
function quizView(){
  const qz = S.quiz;
  if (!qz) return VIEWS.learner.arena();
  if (!qz.n) return `${head(MODE_NAME[qz.mode], 'No approved questions here yet', 'This set has no published questions of a supported type, so there is nothing to practise. Nothing from other courses was substituted.', `<button class="btn btn-primary btn-sm" data-act="nav" data-view="discover">Find another course</button>`)}<div class="empty">Ask your instructor to publish questions for this outcome, or pick another course in Discover.</div>`;
  if (qz.done) return resultView();
  const q = itemByUid(qz.cur), c = courseOf(q.course), L = 'ABCDE';
  const optCls = i => { if (!qz.answered) return qz.sel.includes(i) ? 'sel' : ''; if (q.answer.includes(i)) return 'correct'; if (qz.sel.includes(i)) return 'wrong'; return ''; };
  let body;
  if (q.type === 'order'){
    body = `<ol class="order-list" aria-label="Current order">${qz.sel.map((oi, pos) => { const okPos = oi === q.answer[pos]; return `<li class="order-item ${qz.answered ? (okPos ? 'ok' : 'no') : ''}"><span class="l onum">${pos + 1}</span><span${enAttr()}>${esc(q.options[oi])}</span>${qz.answered ? `<span class="ord-fb ${okPos ? 'ok' : 'no'}">${ic(okPos ? 'check' : 'x', 'ico-sm')} ${okPos ? 'Correct position' : `Belongs at ${q.answer.indexOf(oi) + 1}`}</span>` : `<span class="mv"><button data-act="order" data-pos="${pos}" data-d="-1" aria-label="Move “${esc(q.options[oi])}” up" ${pos === 0 ? 'disabled' : ''}>${ic('up', 'ico-sm')}</button><button data-act="order" data-pos="${pos}" data-d="1" aria-label="Move “${esc(q.options[oi])}” down" ${pos === qz.sel.length - 1 ? 'disabled' : ''}>${ic('down', 'ico-sm')}</button></span>`}</li>`; }).join('')}</ol>`;
  } else {
    body = `<div class="opts" role="group" aria-label="Answer options">${q.options.map((o, i) => { const st = optCls(i); return `<button class="opt ${st}" data-act="pick" data-i="${i}" ${qz.answered ? 'aria-disabled="true"' : ''} ${q.type === 'multi' ? `aria-pressed="${qz.sel.includes(i)}"` : ''}><span class="l">${L[i]}</span><span${enAttr()}>${esc(o)}</span>${qz.answered && st ? `<span class="tick ${st}">${ic(st === 'correct' ? 'check' : 'x', 'ico-sm')}<span class="sr-only">${st === 'correct' ? 'correct answer' : 'your answer, incorrect'}</span></span>` : ''}</button>`; }).join('')}</div>`;
  }
  const needsSubmit = (q.type === 'multi' || q.type === 'order') && !qz.answered;
  const elapsed = (Date.now() - qz.t0) / 1000, left = qz.limit ? Math.max(0, Math.ceil(qz.limit - elapsed)) : null;

function levelRing(sm){
  const { lvAfter, lvBefore, total } = sm, xp = S.lp.xpTotal;
  const span = lvAfter.next - lvAfter.base, prog = (xp - lvAfter.base) / span;
  const gainedStart = lvAfter.level > lvBefore.level ? 0 : Math.max(0, (xp - total - lvAfter.base) / span);
  const R = 62, C = 2 * Math.PI * R, arc = (from, to, col, w) => `<circle cx="80" cy="80" r="${R}" fill="none" stroke="${col}" stroke-width="${w}" stroke-dasharray="${(to - from) * C} ${C}" stroke-dashoffset="${-from * C}" transform="rotate(-90 80 80)"/>`;
  return `<svg viewBox="0 0 160 160" class="m-ring" role="img" aria-label="Level ${lvAfter.level}. ${total} XP gained. ${lvAfter.next - xp} XP to level ${lvAfter.level + 1}.">
    <circle cx="80" cy="80" r="${R}" fill="none" stroke="rgba(255,255,255,.16)" stroke-width="22"/>${arc(0, gainedStart, '#FFFFFF', 22)}${arc(gainedStart, prog, '#FF7A86', 22)}

/* ------------------------------------------------ content lifecycle rules
   One validator for every route into review and publication (audit F04, F07). */
function missingFields(d){
  const miss = [], opts = (d.options || []).map(o => (o || '').trim());
  if (!(d.stem || '').trim()) miss.push(['stem', 'question stem']);
  if (!DELIVERABLE.includes(d.type)) miss.push(['type', `a supported type (${TYPE_LABEL[d.type] || d.type} can’t be delivered yet)`]);
  if (d.type === 'order'){ if (opts.filter(Boolean).length < 3) miss.push(['options', 'at least three steps']); }
  else if (opts.filter(Boolean).length < 2) miss.push(['options', 'at least two options']);
  if (d.type === 'single' && !(d.answer?.length === 1 && opts[d.answer[0]])) miss.push(['answer', 'the correct answer']);
  if (d.type === 'multi' && !(d.answer?.length && d.answer.every(i => opts[i]))) miss.push(['answer', 'at least one correct option']);
  if (!(d.explain || '').trim()) miss.push(['explain', 'explanation']);
  if (!(d.source || '').trim()) miss.push(['source', 'source']);
  if (!d.reviewer) miss.push(['reviewer', 'an independent reviewer']);
  else if ((d.contributors || [S.actor]).includes(d.reviewer)) miss.push(['reviewer', 'a reviewer who did not author or edit this item']);
  return miss;
}
function transitionError(it, to){
  if (to === 'In review'){ const m = missingFields(it); return m.length ? 'Add ' + m.map(x => x[1]).join(', ') + ' before submitting for review.' : null; }
  if (to === 'Published'){
    if (it.status !== 'In review') return 'Only items in review can be published.';
    if (it.contributors.includes(S.actor)) return `${USERS[S.actor].name} authored or edited ${it.id}, so an independent reviewer must approve it.`;
    const m = missingFields({ ...it, reviewer:it.reviewer || 'x' }).filter(x => x[0] !== 'reviewer');
    if (m.length) return `${it.id} is missing ${m.map(x => x[1]).join(', ')}.`;
  }
  return null;
}
function nextCode(){
  let n = Math.max(...S.items.map(x => +x.id.replace(/\D/g, '') || 0)) + 1;
  while (S.items.some(x => x.id === 'Q-' + n)) n++;                       // uniqueness guaranteed (audit F22)
  return 'Q-' + n;
}

/* ---------------------------------------------------------- Live session
   Simulated room with real invariants: answers ≤ joined; timers survive navigation (audit F17). */
const LIVE_UIDS = () => ['Q-1210', 'Q-1640', 'Q-1631'].map(id => publishedOf(id)).filter(Boolean).map(x => x.uid);
const LIVE_STD = 20, LIVE_EXT = Math.round(LIVE_STD * 1.25);
function stopLive(){ if (S.live.timer){ clearInterval(S.live.timer); S.live.timer = null; } }
function ensureLive(){ if (!S.live.timer && ['lobby','question'].includes(S.live.state)) S.live.timer = setInterval(liveTick, 1000); }
function liveTick(){
  const L = S.live;
  if (L.state === 'lobby'){ const add = 6 + Math.round(Math.random() * 14); L.joined = Math.min(612, L.joined + add); L.ext = Math.round(L.joined * .06); }
  if (L.state === 'question'){
    L.elapsed++;
    const q = itemByUid(LIVE_UIDS()[L.q]);
    const stdOpen = L.elapsed <= LIVE_STD, eligible = L.joined - L.count;
    const extEligible = Math.max(0, L.ext - L.extCount);
    const take = Math.min(stdOpen ? eligible : extEligible, 4 + Math.round(Math.random() * 18));
    for (let k = 0; k < take; k++){ const r = Math.random(); const pick = r < .58 ? q.answer[0] : Math.floor(Math.random() * q.options.length); L.dist[pick]++; L.count++; if (!stdOpen) L.extCount++; }
    if (L.elapsed >= LIVE_EXT || L.count >= L.joined){ L.state = 'reveal'; stopLive(); }
  }
  if (S.view === 'live' && S.role === 'instructor' && !S.modal) render();
}

   Exports keep every parameter, create a real file and a resolvable audit entry (audit F14). */
const DATASETS = {
  'Engagement summary':{ aggs:['School','Course','Tutorial group'] },
  'Outcome mastery by course':{ aggs:['Course','Tutorial group'] },
  'Item quality':{ aggs:['Item'] },
};
function exportRows(x){
  const sid = x.school, k = x.k, cs = COURSES.filter(c => !sid || c.school === sid), rows = [];
  if (x.ds === 'Engagement summary'){
    if (x.agg === 'School') (sid ? ADOPTION.filter(a => a.school === sid) : ADOPTION).forEach(a => rows.push({ school:schoolOf(a.school).name, weekly_active_learners:a.wau, active_courses:a.active, adoption_pct:Math.round(a.active / a.courses * 100) }));
    if (x.agg === 'Course') cs.forEach(c => rows.push({ course:c.code, enrolled:c.learners, weekly_active_pct: c.learners < k ? 'suppressed' : 40 + ((c.learners * 7) % 45) }));
    if (x.agg === 'Tutorial group') cs.forEach(c => c.groups.forEach((g, i) => rows.push({ course:c.code, group:GROUP_NAMES[i] || 'Group ' + (i + 1), n: g < k ? 'suppressed' : g, weekly_active_pct: g < k ? 'suppressed' : 50 + ((g * 11) % 40) })));
  }
  if (x.ds === 'Outcome mastery by course'){
    cs.forEach(c => (OUTCOMES_SEED[c.id] || []).forEach(([lo, , m, ev]) => {
      if (x.agg === 'Course') rows.push({ course:c.code, outcome:lo, learners:c.learners, mean_mastery: ev ? clamp(m - 9, 20, 95) : 'no data' });
      else c.groups.forEach((g, i) => rows.push({ course:c.code, outcome:lo, group:GROUP_NAMES[i] || 'Group ' + (i + 1), n: g < k ? 'suppressed' : g, mean_mastery: g < k || !ev ? 'suppressed' : clamp(m - 10 + ((i * 13 + m) % 21) - 8, 15, 98) }));
    }));
  }
  if (x.ds === 'Item quality') S.items.filter(i => cs.some(c => c.id === i.course) && i.facility != null).forEach(i => rows.push({ item:i.id, version:i.ver, course:courseOf(i.course).code, status:i.status, attempts:i.attempts, facility: i.attempts < 30 ? 'suppressed (<30 attempts)' : i.facility.toFixed(2), discrimination: i.attempts < 30 ? 'suppressed (<30 attempts)' : i.disc.toFixed(2) }));
  return rows;
}
const DEFINITIONS = {
  weekly_active_learners:'Learners with ≥1 valid attempt in the last 7 days', adoption_pct:'Courses with ≥1 assigned set ÷ active courses', weekly_active_pct:'Weekly active learners ÷ enrolled',
  mean_mastery:'Mean prototype mastery estimate (0–100), model v1.3', facility:'Share of attempts answered correctly', discrimination:'Point-biserial correlation with total score', n:'Learners in the cell', suppressed:'Cell hidden because it is smaller than the minimum cell size',
};
function exportFile(x){
  const rows = exportRows(x), cols = rows.length ? Object.keys(rows[0]) : [];
  const meta = { dataset:x.ds, aggregation:x.agg, period:x.period, scope:x.scope, minimum_cell_size:x.k, purpose:x.purpose, requested_by:x.actor, generated_at:x.at, audit_id:x.audit, note:'Illustrative prototype data. Not institutional records.' };
  const defs = Object.fromEntries(cols.filter(c => DEFINITIONS[c]).map(c => [c, DEFINITIONS[c]]).concat([['suppressed', DEFINITIONS.suppressed]]));
  if (x.fmt === 'JSON') return { name:`quiz-campus-${x.id}.json`, data:JSON.stringify({ meta, definitions:defs, rows }, null, 2) };
  const q = v => { const s = String(v ?? ''); return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  const head = Object.entries(meta).map(([k, v]) => `# ${k}: ${v}`).concat(Object.entries(defs).map(([k, v]) => `# definition ${k}: ${v}`));
  return { name:`quiz-campus-${x.id}.csv`, data:[...head, cols.join(','), ...rows.map(r => cols.map(c => q(r[c])).join(','))].join('\n') };
}

/* ------------------------------------------------ downloads (real files)
   Uses the viewer's downloads capability when framed by claude.ai; falls back to a
   normal browser download when the file is opened on its own. */
let DL = null, HAS_HOST = !!(window.claude && window.claude.use);
if (HAS_HOST) window.claude.use('downloads').then(d => { DL = d; }).catch(() => {});
async function downloadFile(filename, data){
  if (DL){
    try { await DL.save({ filename, data }); return 'saved'; }
    catch (e){ return e && e.code === 'declined' ? 'declined' : 'unavailable'; }
  }
  if (HAS_HOST) return 'unavailable';
  try {
    const url = URL.createObjectURL(new Blob([data], { type: filename.endsWith('.json') ? 'application/json' : 'text/csv' }));
    const a = Object.assign(document.createElement('a'), { href:url, download:filename }); document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000); return 'saved';
  } catch { return 'unavailable'; }
}
function reportDownload(res, name, data){
  if (res === 'saved') toast(`${name} downloaded.`);
  else if (res === 'declined') toast('Download cancelled. The export record and audit entry are kept.');
  else { S.filePreview = { name, data }; S.modal = 'filePreview'; render(); }
}

function draftToItem(d){
  let options = d.options.map(o => (o || '').trim()), answer = d.answer.slice();
  if (d.type === 'order'){ options = options.filter(Boolean); answer = options.map((_, i) => i); }
  else { const keep = options.map((o, i) => [o, i]).filter(([o]) => o); answer = keep.map(([, i], n) => answer.includes(i) ? n : -1).filter(n => n >= 0); options = keep.map(([o]) => o); }
  return { course:d.course, lo:d.lo, bloom:d.bloom, diff:+d.diff, type:d.type, stem:d.stem.trim(), options, answer, explain:d.explain.trim(), fact:(d.fact || '').trim(), hint:(d.hint || '').trim(), source:d.source.trim(), reviewer:d.reviewer, contributors:d.contributors.slice(), provenance:d.provenance || null };
}

  S.modal = null; S.formError = null; S.fieldErrors = null; S.draft = null; S.draftDirty = false; S.confirmDiscard = false; render();
}
function openEditor(draft, errors){
  S.draft = draft; S.draftDirty = false; S.confirmDiscard = false;
  S.fieldErrors = errors ? Object.fromEntries(errors.map(([k, v]) => [k, v])) : null;
  S.formError = errors ? 'Add ' + errors.map(x => x[1]).join(', ') + '.' : null;
  S.modal = 'newq'; if (errors) S.focusNext = '[aria-invalid="true"]'; render();
}
const rowDraft = (b, mode) => ({ mode, uid:b.uid, id:b.id, ver:b.ver, course:b.course, lo:b.lo, bloom:b.bloom, diff:b.diff, type:b.type, stem:b.stem, explain:b.explain, fact:b.fact, hint:b.hint, source:b.source, reviewer:b.reviewer,
  options: b.type === 'order' ? [...b.options, '', '', '', '', ''].slice(0, Math.max(5, b.options.length)) : [...b.options, '', '', '', ''].slice(0, 4), answer:b.answer.slice(),
  contributors: b.contributors.includes(S.actor) ? b.contributors.slice() : [...b.contributors, S.actor], provenance:b.provenance, ai:b.status === 'AI draft' });
const persistContent = () => save.content();

    const d = S.draft, status = el.dataset.status, item = draftToItem(d);

      const miss = missingFields(item);

    } else if (!item.stem){ S.fieldErrors = { stem:'a question stem' }; S.formError = 'Add at least a question stem to save a draft.'; S.focusNext = '[aria-invalid="true"]'; render(); return; }

    S.modal = null; render(); toast(`${b.id} is in human review with ${USERS[b.reviewer].name}. You are recorded as a contributor (${aid}).`);
  },
  'qb-reject': el => { const b = itemByUid(el.dataset.uid); S.items = S.items.filter(x => x.uid !== b.uid); persistContent(); audit('AI draft discarded', b.id); S.modal = null; render(); toast('AI draft discarded.'); },
  'qb-retire': el => { const b = itemByUid(el.dataset.uid); b.status = 'Retired'; persistContent(); const aid = audit('Question retired', `${b.id} v${b.ver}`); S.modal = null; render(); toast(`${b.id} retired. Learners no longer receive it; past attempts keep their version (${aid}).`); },
  live: el => {

  'ev-delete': el => { const e = S.events.find(x => x.eid === el.dataset.id); S.events = S.events.filter(x => x !== e); save.events(); audit('Event draft deleted', e.name); render(); toast('Draft deleted.'); },

function retryJob(s){
  if (!s || s.status !== 'Failed') return;
  s.status = 'Retrying'; s.msg = `Re-sending with the same key ${s.key}…`; render();
  setTimeout(() => {
    if (s.id === 'gs_8f21'){ s.status = 'Delivered'; s.msg = 'Simulated AGS receipt 200 · lineitem 5521 (attempt 2)'; }
    else { s.status = 'Failed'; s.msg = 'Learner still not enrolled · reconcile the roster, then retry'; }
    audit(`Grade passback retry (simulated): ${s.status}`, `${s.id} · ${s.key}`);
    if (S.role === 'instructor') render();
  }, 1300);
}

const INPUT = {
  'course-search': v => { S.search = v; render(); },
  'qb-search': v => { S.qb.q = v; render(); },
  'global-search': v => { S.gsearch = v; },

function onDraft(el){
  const d = S.draft; if (!d) return; const k = el.dataset.draft, i = +el.dataset.i;
  if (k === 'opt') d.options[i] = el.value;
  else if (k === 'answer') d.answer = d.type === 'multi' ? (el.checked ? [...new Set([...d.answer, i])] : d.answer.filter(x => x !== i)) : [i];
  else d[k] = el.value;
  S.draftDirty = true;
  if (S.fieldErrors && S.fieldErrors[k === 'opt' ? 'options' : k]){ delete S.fieldErrors[k === 'opt' ? 'options' : k]; }
}
function onEx(el, rerender){
  S.exDraft = { ...(S.exDraft || { ds:'Engagement summary', agg:'School', period:'Autumn 2026 (to date)', k:'10', fmt:'CSV', purpose:'' }), [el.dataset.ex]:el.value };
  if (el.dataset.ex === 'ds'){ S.exDraft.agg = DATASETS[el.value].aggs[0]; }
  if (rerender) render();
}

document.addEventListener('click', e => {
  const hit = e.target.closest('.hit'); if (hit){ toggleTip(hit); return; }
  const el = e.target.closest('[data-act]'); if (!el || el.getAttribute('aria-disabled') === 'true') return;
  const fn = A[el.dataset.act]; if (fn) fn(el, e);
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.draft){ onDraft(el); return; }
  if (el.dataset.ex){ onEx(el, el.tagName === 'SELECT' && el.dataset.ex === 'ds'); return; }
  const k = el.dataset.change; if (k && CHANGE[k]){ CHANGE[k](el.value); render(); }
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.draft && el.type !== 'radio' && el.type !== 'checkbox' && el.tagName !== 'SELECT'){ onDraft(el); return; }
  if (el.dataset.ex && el.tagName !== 'SELECT'){ onEx(el, false); if (S.formError){ S.formError = null; } return; }
  const k = el.dataset.input; if (k && INPUT[k]) INPUT[k](el.value);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape'){
    const tip = document.querySelector('.tip.on'); if (tip){ tip.classList.remove('on'); return; }
    if (S.modal){ e.preventDefault(); closeModal(); return; }
    if (S.menu){ S.menu = false; S.focusNext = '.menu-btn'; render(); return; }
  }
  if (e.key === 'Tab' && S.modal){                                   // focus containment
    const m = document.querySelector('#modal-root .modal'); if (!m) return;
    const f = [...m.querySelectorAll(FOCUSABLE)].filter(x => x.offsetParent !== null || x === document.activeElement);
    if (!f.length){ e.preventDefault(); m.focus(); return; }
    const first = f[0], last = f[f.length - 1];
    if (!m.contains(document.activeElement)){ e.preventDefault(); first.focus(); }
    else if (e.shiftKey && (document.activeElement === first || document.activeElement === m)){ e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
  }
  if (e.key === 'Enter' && e.target.dataset && e.target.dataset.input === 'global-search'){
    const v = e.target.value.trim();
    if (S.role === 'learner'){ S.search = v; S.school = 'All'; nav('discover'); }
    else if (S.role === 'instructor'){ S.qb.q = v; nav('bank'); }
    else toast('Institution search isn’t built in this prototype.');
  }
  if (e.key === '/' && !S.modal && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){ const s = document.querySelector('[data-input="global-search"]'); if (s && s.offsetParent){ e.preventDefault(); s.focus(); } }
});
/* chart tooltips: hover, tap and Escape (data tables are the accessible equivalent) */
function showTip(el){
  const wrap = el.closest('.chart-wrap'); if (!wrap) return; const tip = wrap.querySelector('.tip'), svg = wrap.querySelector('svg');
  tip.innerHTML = el.dataset.tip; tip.style.left = (+el.dataset.x * svg.clientWidth) + 'px'; tip.style.top = (+el.dataset.y * svg.clientHeight) + 'px'; tip.classList.add('on'); tip._for = el;
}
function toggleTip(el){ const tip = el.closest('.chart-wrap')?.querySelector('.tip'); if (tip && tip.classList.contains('on') && tip._for === el) tip.classList.remove('on'); else showTip(el); }
document.addEventListener('mouseover', e => { const el = e.target.closest('[data-tip]'); if (el) showTip(el); });
document.addEventListener('mouseout', e => { const el = e.target.closest('[data-tip]'); if (el){ const tip = el.closest('.chart-wrap')?.querySelector('.tip'); if (tip) tip.classList.remove('on'); } });

/* responsive drawer state and browser history */
window.matchMedia('(max-width:960px)').addEventListener('change', () => { S.menu = false; if (S.role) render(); });
window.addEventListener('popstate', () => {
  const r = parseRoute();
  if (S.view === 'quiz' && r.view !== 'quiz') leaveQuiz();
  if (!r.role){ stopLive(); S.role = null; S.view = null; }
  else { S.role = r.role; S.view = r.view === 'quiz' ? (S.quiz ? 'quiz' : 'home') : (VIEWS[r.role][r.view] ? r.view : 'home'); }
  S.menu = false; if (!(S.modal === 'newq' && S.draftDirty)) S.modal = null;
  S.focusNext = '#main'; render();
});

/* init */
(() => {
  const r = parseRoute();
  if (typeof S.theme !== 'object' || S.theme === null) S.theme = store.get('themes', {}) || {};
  if (r.role){ S.role = r.role; S.view = r.view === 'quiz' || !VIEWS[r.role][r.view] ? 'home' : r.view; }
  else if (S.role && ROLES[S.role]) S.view = 'home';
  else S.role = null;
  pushRoute(true); render();
})();

</script>
</body>
</html>
