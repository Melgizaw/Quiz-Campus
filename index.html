<!doctype html>
<html lang="en" dir="ltr" data-mode="day">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quiz-Campus · HBMSU</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
[hidden]{display:none!important}
/* =====================================================================
   Quiz-Campus · HBMSU Edition — Design system
   Brand source: HBMSU Brand Book V7.0 (palette 04.1/04.2/04.4, Cairo,
   gradient strip 05.1, 2px rounded-cap icons, 12-col / 1280px grid).
   Two themes share one token set:
     [data-mode="night"]  immersive learner arena (default for learners)
     [data-mode="day"]    professional staff workspace (default for staff)
   All layout uses logical properties so dir="rtl" (Arabic) mirrors cleanly.
   ===================================================================== */


:root{
  /* HBMSU primary palette */
  --regal:#0044D5; --ocean:#002EA1; --skyline:#0064FF; --midnight:#00005E;
  --onyx:#000C2E; --steel:#818181; --cloud:#E7F1F3; --white:#FFFFFF;
  /* HBMSU secondary palette */
  --orange:#FF5E00; --red:#EA0516; --golden:#F19000; --yellow:#FFCC00;
  --green:#05CE39; --deep-green:#017F1B; --teal-green:#009378; --bright-green:#00AA33;
  --purple:#9318FF; --violet:#5C10AD; --magenta:#FF0090; --light-magenta:#EF77FF;
  --bright-teal:#00ADCF; --teal:#2097A0; --bright-blue:#0080CE; --sky:#00C3FF;
  /* School colours (04.4) */
  --school-bqm:#9318FF; --school-hs:#00ADCF; --school-sge:#05CE39; --school-edu:#FF5E00;
  /* Brand gradient strip: blue solid 0–20% & 80–100%, red 35%, orange 65% */
  --strip:linear-gradient(90deg,var(--regal) 0 20%,var(--red) 35%,var(--orange) 65%,var(--regal) 80% 100%);
  --hero:linear-gradient(120deg,#0064FF 0%,#0044D5 45%,#002EA1 100%);

  --r-xl:24px; --r-lg:20px; --r-md:14px; --r-sm:10px; --r-pill:999px;
  --side-w:264px;
  --font:'Cairo',Tahoma,'Segoe UI',sans-serif;
  font-family:var(--font); font-synthesis:none; -webkit-font-smoothing:antialiased;
}

/* ---------- Theme tokens ---------- */
[data-mode="night"]{
  --bg:#000A3B; --bg-glow:#0038B8; --surface:#0A1F78; --surface-2:#10298F; --surface-3:#163AAE;
  --line:rgba(255,255,255,.11); --line-2:rgba(255,255,255,.2);
  --text:#FFFFFF; --muted:#C2CFF4; --faint:#A3B4E8;
  --primary:#0064FF; --primary-ink:#FFFFFF; --focus:#FFCC00;
  --row:#FFFFFF; --row-text:#00005E; --row-muted:#5B6690;
  --chip:#ffffff17; --shadow:0 18px 40px rgba(0,4,40,.45);
  --ok-bg:#0B5B3A; --ok:#4BE38A; --warn-bg:#5E3A06; --warn:#FFC24D; --bad-bg:#5C0B22; --bad:#FF7A86; --info-bg:#06407A; --info:#6FD3FF;
  --track:rgba(255,255,255,.14); --grid:rgba(255,255,255,.08);
  color-scheme:dark;
}
[data-mode="day"]{
  --bg:#E7F1F3; --bg-glow:#CFE2FF; --surface:#FFFFFF; --surface-2:#F3F8FA; --surface-3:#E9F1FB;
  --line:#D7E3EA; --line-2:#BFD0DC;
  --text:#000C2E; --muted:#45537A; --faint:#555F78;
  --primary:#0044D5; --primary-ink:#FFFFFF; --focus:#F19000;
  --row:#F3F8FA; --row-text:#000C2E; --row-muted:#5B6690;
  --chip:#E9F1FB; --shadow:0 12px 30px rgba(0,20,80,.08);
  --ok-bg:#DDF7E6; --ok:#017F1B; --warn-bg:#FFF1D6; --warn:#9A5A00; --bad-bg:#FDE1E3; --bad:#B0000F; --info-bg:#DDEBFF; --info:#0044D5;
  --track:#E1EAF2; --grid:#E6EDF3;
  color-scheme:light;
}

*{box-sizing:border-box}
html,body{margin:0}
body{min-width:320px;background:var(--bg);color:var(--text);font:400 14px/1.6 var(--font)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:8px}
svg{display:block}
a{color:inherit}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ico{width:20px;height:20px;flex:none;display:inline-block;vertical-align:-4px}
.ico-sm{width:16px;height:16px;flex:none;display:inline-block;vertical-align:-3px}

/* ---------- Brand lock-up ---------- */
.lockup{display:flex;align-items:center;gap:12px}
.mark{width:40px;height:40px;border-radius:12px;background:var(--hero);display:grid;place-items:center;box-shadow:0 8px 20px rgba(0,68,213,.45);flex:none}
.mark svg{width:24px;height:24px}
.word{font:800 20px/1 var(--font);letter-spacing:-.3px;color:#fff}
.word b{color:var(--yellow);font-weight:800}
.word small{display:block;margin-top:5px;font:700 9.5px/1 var(--font);letter-spacing:2.2px;color:#9FB4F0;text-transform:uppercase}
.cobrand{display:flex;align-items:center;gap:10px;margin-top:14px;padding-inline-start:2px;color:#C9D6FA;font:600 10.5px/1.35 var(--font)}
.cobrand i{width:2px;align-self:stretch;background:#ffffff40;border-radius:2px}

/* ---------- Strip ---------- */
.strip{height:4px;background:var(--strip);background-size:100% 100%}
.strip-thin{height:3px;border-radius:3px;background:var(--strip)}

/* ---------- Shell ---------- */
.shell{min-height:100vh;display:grid;grid-template-columns:var(--side-w) minmax(0,1fr)}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;background:linear-gradient(180deg,#00005E 0%,#000C2E 100%);color:#fff;padding:24px 16px 18px;z-index:20;overflow-y:auto;border-inline-end:1px solid rgba(255,255,255,.06)}
.side-brand{padding:0 8px 22px}
.role-chip{display:flex;align-items:center;gap:10px;margin:0 4px 18px;padding:10px 12px;border-radius:var(--r-md);background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1)}
.role-chip .dot{width:8px;height:8px;border-radius:50%;background:var(--c,var(--green));box-shadow:0 0 0 4px color-mix(in srgb,var(--c,var(--green)) 25%,transparent)}
.role-chip strong{font-size:12.5px;display:block;line-height:1.2}
.role-chip small{font-size:10.5px;color:#9FB4F0}
.nav-label{padding:0 12px;margin:14px 0 8px;color:#7F93CC;font:800 10px/1 var(--font);letter-spacing:1.6px;text-transform:uppercase}
.nav{display:grid;gap:3px}
.nav-btn{display:flex;align-items:center;gap:12px;width:100%;padding:11px 12px;border-radius:12px;color:#B9C7EE;font-weight:600;font-size:13.5px;text-align:start;transition:background .15s,color .15s;position:relative}
.nav-btn:hover{background:rgba(255,255,255,.07);color:#fff}
.nav-btn.active{background:linear-gradient(90deg,#0044D5,#002EA1);color:#fff;box-shadow:0 8px 20px rgba(0,40,160,.45)}
.nav-btn.active:before{content:'';position:absolute;inset-inline-start:-16px;top:10px;bottom:10px;width:4px;border-radius:0 4px 4px 0;background:var(--strip)}
[dir="rtl"] .nav-btn.active:before{border-radius:4px 0 0 4px}
.nav-btn .count{margin-inline-start:auto;font-size:10.5px;font-weight:800;background:var(--orange);color:#fff;border-radius:var(--r-pill);padding:1px 8px}
.side-spacer{flex:1;min-height:16px}
.side-card{margin:6px 4px 14px;padding:16px;border-radius:var(--r-lg);background:linear-gradient(145deg,#0044D5,#002EA1);position:relative;overflow:hidden}
.side-card:after{content:'';position:absolute;inset-inline-end:-30px;top:-30px;width:110px;height:110px;border-radius:50%;border:16px solid rgba(255,255,255,.08)}
.side-card strong{font:700 13.5px/1.3 var(--font);display:block}
.side-card p{margin:6px 0 12px;font-size:11.5px;line-height:1.5;color:#D3DEFF;max-width:170px}
.side-profile{display:flex;align-items:center;gap:10px;padding:14px 8px 0;border-top:1px solid rgba(255,255,255,.1);width:100%;text-align:start;color:#fff}
.side-profile:hover .chev{color:#fff}
.side-profile strong{display:block;font-size:12.5px;line-height:1.25}
.side-profile small{font-size:10.5px;color:#9FB4F0}
.side-profile .chev{margin-inline-start:auto;color:#7F93CC}
.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font:800 12.5px/1 var(--font);color:#00005E;background:var(--av,linear-gradient(145deg,#FFCC00,#FF5E00));flex:none;border:2px solid rgba(255,255,255,.75)}
.avatar.lg{width:52px;height:52px;font-size:16px}
.avatar.xl{width:72px;height:72px;font-size:22px}

.main{min-width:0;display:flex;flex-direction:column;background:radial-gradient(900px 420px at 85% -10%,var(--bg-glow) 0,transparent 60%),var(--bg)}
[data-mode="day"] .main{background:var(--bg)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;display:flex;align-items:center;gap:16px;height:72px;padding:0 clamp(18px,3.2vw,44px);background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.crumbs{font-size:12.5px;color:var(--faint);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumbs b{color:var(--text);font-weight:700}
.top-search{flex:1;max-width:420px;margin-inline-start:auto;display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line);color:var(--faint)}
.top-search input{flex:1;border:0;background:none;outline:none;color:var(--text);font-size:13px;min-width:0}
.top-search kbd{font:700 10px var(--font);border:1px solid var(--line-2);border-radius:6px;padding:1px 6px;color:var(--faint)}
.top-actions{display:flex;align-items:center;gap:8px}
.icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);color:var(--muted);position:relative;transition:color .15s,border-color .15s}
.icon-btn:hover{color:var(--text);border-color:var(--line-2)}
.icon-btn .ping{position:absolute;top:8px;inset-inline-end:9px;width:8px;height:8px;border-radius:50%;background:var(--orange);border:2px solid var(--surface)}
.lang-btn{font:800 13px/1 var(--font);width:auto;padding:0 12px}
.sync-pill{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 12px;border-radius:var(--r-pill);font-size:11.5px;font-weight:700;background:var(--ok-bg);color:var(--ok);white-space:nowrap}
.sync-pill i{width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 0 3px color-mix(in srgb,currentColor 25%,transparent);animation:pulse 2.4s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px transparent}}
.menu-btn{display:none}
.content{width:100%;max-width:1360px;margin:0 auto;padding:28px clamp(18px,3.2vw,44px) 80px}

/* ---------- Typography ---------- */
.eyebrow{font:800 11px/1.2 var(--font);letter-spacing:1.6px;text-transform:uppercase;color:var(--primary)}
[data-mode="night"] .eyebrow{color:#7FB0FF}
.h-page{font:800 clamp(26px,2.6vw,36px)/1.2 var(--font);letter-spacing:-.4px;margin:6px 0 4px}
.sub{margin:0;color:var(--muted);font-size:14px;max-width:680px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;flex-wrap:wrap;margin-bottom:22px}
.page-head .actions{display:flex;gap:10px;flex-wrap:wrap}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:30px 0 14px}
.sec-head h2{font:700 19px/1.3 var(--font);margin:0}
.sec-head p{margin:2px 0 0;color:var(--muted);font-size:12.5px}
.link{color:var(--primary);font-weight:700;font-size:12.5px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
[data-mode="night"] .link{color:#8DB8FF}
.link:hover{text-decoration:underline}
.muted{color:var(--muted)} .faint{color:var(--faint)}
.num{font-variant-numeric:tabular-nums}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 18px;border-radius:12px;font-weight:700;font-size:13px;white-space:nowrap;transition:transform .15s,filter .15s,background .15s}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:none}
.btn-primary{background:linear-gradient(110deg,#0064FF,#0044D5);color:#fff;box-shadow:0 8px 18px rgba(0,68,213,.32)}
.btn-primary:hover{filter:brightness(1.08)}
.btn-light{background:#fff;color:#0044D5}
.btn-ghost{background:var(--chip);color:var(--text);border:1px solid var(--line)}
.btn-ghost:hover{border-color:var(--line-2)}
.btn-warm{background:linear-gradient(110deg,#FF5E00,#EA0516);color:#fff;box-shadow:0 8px 18px rgba(234,5,22,.25)}
.btn-sm{height:34px;padding:0 12px;font-size:12px;border-radius:10px}
.btn-xs{height:28px;padding:0 10px;font-size:11.5px;border-radius:8px}
.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none}

/* ---------- Surfaces & grids ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px;position:relative}
[data-mode="day"] .card{box-shadow:var(--shadow)}
.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px}
.card-head h3{margin:0;font:700 15.5px/1.35 var(--font)}
.card-head small{color:var(--faint);font-size:11.5px;display:block}
.grid{display:grid;gap:18px}
.g-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-main{grid-template-columns:minmax(0,1.65fr) minmax(300px,1fr)}
.g-main-r{grid-template-columns:minmax(300px,1fr) minmax(0,1.65fr)}
.stack{display:grid;gap:18px;align-content:start}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.mt-0{margin-top:0}.mt-1{margin-top:8px}.mt-2{margin-top:16px}.mt-3{margin-top:24px}

/* ---------- KPI ---------- */
.kpi{display:flex;flex-direction:column;gap:4px}
.kpi .lbl{font:700 11px/1.3 var(--font);letter-spacing:.6px;text-transform:uppercase;color:var(--faint)}
.kpi .val{font:800 30px/1.15 var(--font);letter-spacing:-.5px}
.kpi .val small{font-size:15px;font-weight:700;color:var(--muted);margin-inline-start:2px}
.kpi .delta{font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:4px}
.delta.up{color:var(--ok)} .delta.down{color:var(--bad)} .delta.flat{color:var(--faint)}
.kpi .def{font-size:11px;color:var(--faint)}
.kpi .spark{margin-top:6px;height:34px}
.kpi-ico{position:absolute;inset-inline-end:16px;top:16px;width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:color-mix(in srgb,var(--c,var(--regal)) 14%,transparent);color:var(--c,var(--regal))}
[data-mode="night"] .kpi-ico{background:color-mix(in srgb,var(--c,var(--skyline)) 26%,transparent);color:#fff}

/* ---------- Pills, chips, status ---------- */
.pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:var(--r-pill);font:700 11px/1 var(--font);white-space:nowrap;background:var(--chip);color:var(--muted)}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.info{background:var(--info-bg);color:var(--info)}
.pill.ai{background:linear-gradient(90deg,color-mix(in srgb,var(--purple) 22%,transparent),color-mix(in srgb,var(--skyline) 22%,transparent));color:var(--text)}
.pill .ico-sm{width:13px;height:13px}
.tag-school{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;color:var(--muted)}
.tag-school:before{content:'';width:8px;height:8px;border-radius:3px;background:var(--c)}
.bloom{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:6px;font:800 10.5px/1 var(--font);letter-spacing:.3px;color:#fff;background:var(--c)}

/* ---------- Tabs / segmented ---------- */
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{height:36px;padding:0 14px;border-radius:var(--r-pill);border:1px solid var(--line);background:var(--surface);color:var(--muted);font-weight:700;font-size:12.5px;display:inline-flex;align-items:center;gap:7px}
.tab:hover{color:var(--text)}
.tab.active{background:var(--primary);border-color:var(--primary);color:#fff}
.tab .sw{width:8px;height:8px;border-radius:3px;background:var(--c)}
.seg{display:inline-flex;padding:4px;border-radius:var(--r-pill);background:var(--surface-2);border:1px solid var(--line)}
.seg button{height:32px;padding:0 16px;border-radius:var(--r-pill);font-weight:700;font-size:12.5px;color:var(--muted)}
.seg button.active{background:var(--primary);color:#fff;box-shadow:0 4px 12px rgba(0,68,213,.3)}

/* ---------- Progress ---------- */
.bar{height:8px;border-radius:var(--r-pill);background:var(--track);overflow:hidden}
.bar>i{display:block;height:100%;width:var(--v);border-radius:var(--r-pill);background:var(--c,var(--skyline));transition:width .6s cubic-bezier(.2,.8,.2,1)}
.bar.thin{height:6px}
.radial{--p:72;--c:var(--yellow);width:88px;height:88px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p)*1%),rgba(255,255,255,.18) 0);display:grid;place-items:center;flex:none}
.radial>div{width:70px;height:70px;border-radius:50%;background:var(--rbg,#0B2FA8);display:flex;align-items:center;justify-content:center;font:800 19px/1 var(--font)}
.radial>div small{font-size:11px;opacity:.75}
.radial.sm{width:56px;height:56px}.radial.sm>div{width:44px;height:44px;font-size:13px}
[data-mode="day"] .radial{background:conic-gradient(var(--c) calc(var(--p)*1%),var(--track) 0)}
[data-mode="day"] .radial>div{background:var(--surface)}

/* ---------- Portal ---------- */
.portal{min-height:100vh;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);background:#000C2E;color:#fff}
.portal-art{position:relative;overflow:hidden;padding:48px clamp(24px,5vw,72px);display:flex;flex-direction:column;background:radial-gradient(700px 500px at 20% 110%,#0064FF 0,transparent 60%),radial-gradient(600px 400px at 100% 0,#002EA1 0,transparent 70%),#00005E}
.portal-art h1{font:800 clamp(34px,4.4vw,60px)/1.08 var(--font);letter-spacing:-1px;margin:auto 0 16px;max-width:620px}
.portal-art h1 em{font-style:normal;background:linear-gradient(90deg,#FFCC00,#FF5E00);-webkit-background-clip:text;background-clip:text;color:transparent}
.portal-art p{color:#C5D3FA;font-size:16px;line-height:1.7;max-width:520px;margin:0 0 28px}
.portal-stats{display:flex;gap:30px;flex-wrap:wrap}
.portal-stats div strong{display:block;font:800 26px/1 var(--font)}
.portal-stats div small{color:#9FB4F0;font-size:12px}
.portal-orbit{position:absolute;inset-inline-end:-120px;top:90px;width:520px;height:520px;pointer-events:none;opacity:.95}
.portal-form{background:var(--cloud);color:var(--onyx);padding:48px clamp(24px,5vw,72px);display:flex;flex-direction:column;justify-content:center}
.portal-form h2{font:800 28px/1.2 var(--font);margin:0 0 6px}
.portal-form>p{margin:0 0 26px;color:#45537A}
.role-card{display:flex;align-items:center;gap:16px;width:100%;padding:18px;border-radius:18px;background:#fff;border:2px solid transparent;text-align:start;margin-bottom:12px;box-shadow:0 8px 24px rgba(0,20,80,.06);transition:border-color .15s,transform .15s}
.role-card:hover{border-color:#0044D5;transform:translateY(-2px)}
.role-card .ri{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;color:#fff;background:var(--c);flex:none}
.role-card strong{display:block;font:700 16px/1.3 var(--font)}
.role-card small{color:#45537A;font-size:12.5px;line-height:1.5;display:block}
.role-card .go{margin-inline-start:auto;color:#0044D5}
.sso-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.sso{display:flex;align-items:center;justify-content:center;gap:8px;height:46px;border-radius:12px;background:#fff;border:1px solid #D7E3EA;font-weight:700;font-size:12.5px;color:#000C2E}
.sso:hover{border-color:#0044D5}
.legal{margin-top:22px;font-size:11.5px;color:#6F7890;line-height:1.6}

/* ---------- Learner: hero (Image-2 "Continue Quiz") ---------- */
.l-hero{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(280px,1fr);gap:18px}
.continue{border-radius:var(--r-xl);padding:26px 28px;background:var(--hero);color:#fff;position:relative;overflow:hidden;box-shadow:0 22px 44px rgba(0,30,140,.45);min-height:250px}
.continue:before{content:'';position:absolute;width:340px;height:340px;border-radius:50%;inset-inline-end:-60px;top:-170px;border:1px solid rgba(255,255,255,.18);box-shadow:0 0 0 46px rgba(255,255,255,.05),0 0 0 92px rgba(255,255,255,.035)}
.continue .k{display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border-radius:var(--r-pill);background:rgba(255,255,255,.16);font-size:11.5px;font-weight:700}
.continue h2{font:800 clamp(24px,2.4vw,32px)/1.15 var(--font);margin:14px 0 4px;max-width:440px}
.continue .meta{color:#D6E2FF;font-size:13px}
.continue .prog{display:flex;align-items:center;gap:14px;margin:18px 0;max-width:430px}
.continue .prog .bar{flex:1;background:rgba(255,255,255,.22)}
.continue .prog .bar>i{background:#fff}
.continue .resume{display:flex;align-items:center;justify-content:center;gap:9px;height:48px;width:min(100%,430px);border-radius:14px;background:#EAF1FF;color:#0044D5;font-weight:800;font-size:14px}
.continue .resume:hover{background:#fff}
.continue .art{position:absolute;inset-inline-end:8px;bottom:0;width:250px;height:230px;pointer-events:none}
[dir="rtl"] .continue .art{transform:scaleX(-1)}
.continue .radial{position:absolute;inset-inline-end:28px;top:26px;--rbg:#0A3FCF}
.goal{display:flex;flex-direction:column;justify-content:space-between;gap:16px}
.goal-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.goal-stats div{padding:12px;border-radius:var(--r-md);background:var(--surface-2)}
.goal-stats strong{display:block;font:800 20px/1.1 var(--font)}
.goal-stats small{font-size:11px;color:var(--muted)}

/* Quick play tiles (Image-2 coral / mint) */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.tile{border-radius:var(--r-lg);padding:18px;min-height:160px;display:flex;flex-direction:column;align-items:flex-start;text-align:start;color:#fff;background:var(--g);position:relative;overflow:hidden;transition:transform .18s}
.tile:hover{transform:translateY(-4px)}
.tile:after{content:'';position:absolute;inset-inline-end:-36px;bottom:-36px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.12)}
.tile .ti{width:44px;height:44px;border-radius:13px;background:rgba(255,255,255,.2);display:grid;place-items:center}
.tile .ti svg{width:24px;height:24px}
.tile strong{font:800 16px/1.25 var(--font);margin-top:auto}
.tile small{font-size:12px;opacity:.9;line-height:1.45;margin-top:3px;max-width:200px}
.tile .live{position:absolute;inset-inline-end:14px;top:14px;display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:var(--r-pill);background:rgba(0,0,0,.22);font-size:10.5px;font-weight:800;letter-spacing:.6px}
.tile .live i{width:6px;height:6px;border-radius:50%;background:#fff;animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.25}}

/* Stat tiles (Image-2 "Your Stats") */
.stat-tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.stat-tile{border-radius:var(--r-md);padding:14px 16px;background:var(--g);color:#fff;display:flex;flex-direction:column;gap:2px;min-height:96px}
.stat-tile svg{width:22px;height:22px}
.stat-tile strong{font:800 24px/1.1 var(--font);margin-top:auto}
.stat-tile small{font-size:11.5px;opacity:.9}

/* Coach */
.coach{background:linear-gradient(150deg,var(--surface-2),var(--surface));overflow:hidden}
.coach .ci{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,#9318FF,#0064FF);color:#fff;box-shadow:0 8px 20px rgba(147,24,255,.35)}
.coach h3{font:700 17px/1.35 var(--font);margin:14px 0 6px}
.coach p{color:var(--muted);font-size:13px;margin:0 0 14px}
.nba{display:flex;align-items:center;gap:12px;padding:12px;border-radius:var(--r-md);background:var(--chip);margin-top:8px;width:100%;text-align:start;transition:background .15s}
.nba:hover{background:var(--surface-3)}
.nba .n{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--c);color:#fff;flex:none}
.nba strong{display:block;font-size:13px;line-height:1.3}
.nba small{display:block;font-size:11.5px;color:var(--muted)}
.nba .ico-sm{margin-inline-start:auto;color:var(--faint)}

/* Quest / narrative */
.quest{border-radius:var(--r-lg);padding:20px;color:#fff;background:linear-gradient(135deg,#5C10AD,#9318FF 55%,#FF0090);position:relative;overflow:hidden}
.quest:after{content:'';position:absolute;inset-inline-end:-40px;top:-40px;width:160px;height:160px;border-radius:50%;border:22px solid rgba(255,255,255,.1)}
.quest .chap{font:800 10.5px/1 var(--font);letter-spacing:1.4px;text-transform:uppercase;opacity:.85}
.quest h3{font:800 19px/1.3 var(--font);margin:8px 0 4px}
.quest p{font-size:12.5px;line-height:1.55;opacity:.92;margin:0;max-width:330px}
.quest .steps{display:flex;gap:6px;margin:16px 0 14px}
.quest .steps i{flex:1;height:6px;border-radius:6px;background:rgba(255,255,255,.25)}
.quest .steps i.on{background:#FFCC00}
.quest .btn-light{color:#5C10AD}

/* Course cards (brand: 3-up, blue underline on hover) */
.course{display:flex;flex-direction:column;text-align:start;gap:6px;padding:18px;border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--line);min-height:220px;position:relative;overflow:hidden;transition:transform .18s,border-color .18s}
.course:after{content:'';position:absolute;inset-inline:0;bottom:0;height:3px;background:var(--regal);transform:scaleX(0);transform-origin:left;transition:transform .25s}
[dir="rtl"] .course:after{transform-origin:right}
.course:hover{transform:translateY(-3px);border-color:var(--line-2)}
.course:hover:after{transform:scaleX(1)}
.course .ci{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:var(--c);color:#fff;box-shadow:0 8px 18px color-mix(in srgb,var(--c) 40%,transparent)}
.course .code{margin-top:10px;font:800 10.5px/1 var(--font);letter-spacing:.8px;text-transform:uppercase;color:var(--faint)}
.course strong{font:700 16px/1.3 var(--font)}
.course .meta{font-size:12px;color:var(--muted)}
.course .bar{margin-top:auto}
.course .foot{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted)}
.course .foot b{color:var(--text)}

/* Discover banner (Image-3 "Science Week") */
.banner{border-radius:var(--r-xl);padding:28px 30px;background:linear-gradient(120deg,#002EA1,#0044D5 60%,#0064FF);color:#fff;position:relative;overflow:hidden;min-height:200px;display:flex;flex-direction:column;justify-content:center}
.banner h2{font:800 30px/1.15 var(--font);margin:6px 0}
.banner p{color:#D6E2FF;max-width:420px;margin:0 0 16px}
.banner .art{position:absolute;inset-inline-end:20px;bottom:-10px;width:230px;height:220px;pointer-events:none}
[dir="rtl"] .banner .art{transform:scaleX(-1)}
.banner .strip-thin{position:absolute;inset-inline:0;bottom:0;border-radius:0}

/* Leaderboard (Image-1/2 white rows + podium) */
.lb-row{display:grid;grid-template-columns:30px 40px minmax(0,1fr) auto;align-items:center;gap:12px;padding:10px 14px;border-radius:14px;background:var(--row);color:var(--row-text);margin-top:8px}
.lb-row .rk{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;border:1.5px solid #C9D3EA;font-size:11px;font-weight:800;color:var(--row-muted)}
.lb-row .nm{font-weight:700;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.lb-row .dt{font-size:11.5px;color:var(--row-muted);display:block}
.lb-row .pts{font-weight:800;font-size:13px;color:#0044D5;white-space:nowrap}
.lb-row.me{background:#FFF4D6;box-shadow:inset 0 0 0 2px #FFCC00}
.lb-row .crown{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;color:#fff;background:var(--c)}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:12px;padding:10px 0 0}
.pod{width:min(30%,170px);text-align:center}
.pod .avatar{margin:0 auto 8px;width:58px;height:58px;font-size:17px;border:3px solid #fff}
.pod.first .avatar{width:72px;height:72px;font-size:20px;border-color:#FFCC00}
.pod b{display:block;font-size:13px;line-height:1.3}
.pod small{font-size:11.5px;color:var(--muted)}
.pod .base{margin-top:10px;border-radius:14px 14px 0 0;display:grid;place-items:center;font:900 34px/1 var(--font);color:#fff;height:90px;background:linear-gradient(#3D7BFF,#0044D5)}
.pod.first .base{height:124px;background:linear-gradient(#FFCC00,#F19000);color:#5E3A06}
.pod.third .base{height:70px;background:linear-gradient(#FF8A3D,#FF5E00)}

/* Badges */
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:12px}
.badge{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:16px 10px;border-radius:var(--r-md);background:var(--surface-2);border:1px solid var(--line)}
.badge .bi{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;color:#fff;background:var(--c);box-shadow:0 0 0 5px color-mix(in srgb,var(--c) 22%,transparent)}
.badge strong{font-size:12px;line-height:1.3}
.badge small{font-size:10.5px;color:var(--faint);line-height:1.35}
.badge.locked{opacity:.55}
.badge.locked .bi{background:var(--track);color:var(--faint);box-shadow:none}

/* Mastery map */
.mmap{display:grid;gap:8px}
.mrow{display:grid;grid-template-columns:minmax(150px,1.2fr) minmax(0,3fr) 54px;align-items:center;gap:12px;font-size:12.5px}
.mrow .cells{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:4px}
.mcell{height:28px;border-radius:7px;background:var(--cbg);position:relative;cursor:default}
.mcell:hover{outline:2px solid var(--text);outline-offset:1px}
.legend{display:flex;align-items:center;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:4px;background:var(--c)}

/* ---------- Quiz / arena (Image-1/3 question screen) ---------- */
.quiz{max-width:880px;margin:0 auto}
.q-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.q-count{display:inline-flex;align-items:center;gap:10px}
.q-count .p{background:#fff;color:#0044D5;font-weight:800;font-size:13px;border-radius:var(--r-pill);padding:3px 12px}
.q-count .bar{width:120px}
.coins{display:inline-flex;align-items:center;gap:7px;padding:5px 12px;border-radius:var(--r-pill);background:var(--surface-2);font-weight:800;font-size:13px}
.coins i{width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,#FFCC00 60%,#F19000)}
.versus{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:14px;margin:18px 0;padding:14px 16px;border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--line)}
.vs-side{display:flex;align-items:center;gap:10px;min-width:0}
.vs-side.ai{flex-direction:row-reverse;text-align:end}
.vs-side strong{display:block;font-size:13px}
.vs-side small{font-size:11px;color:var(--muted)}
.vs-score{font:900 26px/1 var(--font);display:flex;gap:10px;align-items:center}
.vs-score span{color:var(--faint);font-size:14px;font-weight:700}
.ai-av{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,#9318FF,#0064FF);color:#fff;flex:none}
.timer{height:6px;border-radius:6px;background:var(--track);overflow:hidden;margin-bottom:16px}
.timer i{display:block;height:100%;background:linear-gradient(90deg,#05CE39,#FFCC00,#FF5E00);transform-origin:left;animation:timer var(--t,30s) linear forwards}
[dir="rtl"] .timer i{transform-origin:right}
.timer.stop i{animation-play-state:paused}
@keyframes timer{from{transform:scaleX(1)}to{transform:scaleX(0)}}
.q-card{border-radius:var(--r-xl);padding:clamp(20px,4vw,36px);background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.q-meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.q-card h2{font:700 clamp(21px,2.4vw,28px)/1.35 var(--font);margin:16px 0 8px}
.q-card .hint-line{font-size:12.5px;color:var(--muted);margin:0 0 14px}
.q-art{height:150px;border-radius:var(--r-lg);margin:4px 0 18px;background:radial-gradient(circle at 50% 70%,#0064FF 0,#002EA1 45%,#00005E 100%);position:relative;overflow:hidden;display:grid;place-items:center}
.q-art svg{height:130px;width:auto}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{display:flex;align-items:center;gap:12px;min-height:56px;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line-2);background:var(--surface-2);font-weight:600;font-size:14px;text-align:start;transition:border-color .15s,background .15s}
.opt:hover:not([disabled]){border-color:var(--skyline)}
.opt .l{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--chip);font-weight:800;font-size:12px}
.opt.sel{border-color:var(--skyline);background:color-mix(in srgb,var(--skyline) 16%,var(--surface-2))}
.opt.correct{border-color:var(--green);background:color-mix(in srgb,var(--teal-green) 35%,var(--surface-2))}
.opt.correct .l{background:var(--green);color:#00320E}
.opt.wrong{border-color:var(--red);background:color-mix(in srgb,var(--red) 20%,var(--surface-2))}
.opt .tick{margin-inline-start:auto;color:var(--green)}
.opt[disabled]{cursor:default}
.order-list{display:grid;gap:8px}
.order-item{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;background:var(--surface-2);border:1.5px solid var(--line-2);font-weight:600}
.order-item .mv{margin-inline-start:auto;display:flex;gap:4px}
.order-item .mv button{width:30px;height:30px;border-radius:8px;background:var(--chip);display:grid;place-items:center}
.order-item.ok{border-color:var(--green)} .order-item.no{border-color:var(--red)}
.fact{margin-top:16px;padding:16px 18px;border-radius:16px;background:#FFE3C7;color:#3A1A00}
.fact strong,.fact h3{display:flex;align-items:center;gap:8px;color:#B0000F;font-size:15px;margin:0;font-weight:800}
.fact p{margin:6px 0 0;font-size:13.5px;line-height:1.6}
.fact.bad{background:#FFE0E3}
.aihint{margin-top:14px;padding:14px 16px;border-radius:14px;border:1px dashed color-mix(in srgb,var(--purple) 60%,transparent);background:color-mix(in srgb,var(--purple) 10%,transparent);font-size:13px}
.aihint .src{display:block;margin-top:6px;font-size:11px;color:var(--faint)}
.q-actions{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:18px;flex-wrap:wrap}
.adapt{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.result{text-align:center;max-width:720px;margin:0 auto}
.medal{width:96px;height:96px;margin:0 auto;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#FFCC00,#FF5E00);box-shadow:0 0 0 10px rgba(255,204,0,.2);color:#fff}
.medal svg{width:46px;height:46px}
.res-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:22px 0}
.res-stats div{padding:14px;border-radius:var(--r-md);background:var(--surface-2)}
.res-stats strong{display:block;font:800 22px/1.2 var(--font)}
.res-stats small{font-size:11.5px;color:var(--muted)}
.delta-list{text-align:start}

/* Modes */
.mode{display:flex;flex-direction:column;padding:0;overflow:hidden}
.mode .mart{height:120px;background:var(--g);position:relative;display:grid;place-items:center;color:#fff}
.mode .mart svg{width:52px;height:52px}
.mode .mart:before,.mode .mart:after{content:'';position:absolute;border:1px solid rgba(255,255,255,.25);border-radius:50%;width:120px;height:120px;inset-inline-end:-30px;top:-60px}
.mode .mart:after{width:180px;height:180px;inset-inline-end:-60px;top:-90px}
.mode .mbody{padding:18px 20px 20px;display:flex;flex-direction:column;flex:1}
.mode h3{font:700 17px/1.3 var(--font);margin:0 0 6px}
.mode p{font-size:13px;color:var(--muted);margin:0 0 14px}
.mode ul{margin:0 0 16px;padding-inline-start:18px;font-size:12.5px;color:var(--muted)}
.mode .btn{margin-top:auto;align-self:flex-start}
.codebox{display:flex;gap:8px}
.codebox input{flex:1;min-width:0;height:42px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface-2);padding:0 12px;font-weight:800;letter-spacing:3px;color:var(--text)}

/* ---------- Tables ---------- */
.table-wrap{overflow-x:auto;border-radius:var(--r-md);border:1px solid var(--line)}
table.t{width:100%;border-collapse:collapse;font-size:13px;min-width:640px}
.t th{text-align:start;font:800 10.5px/1.2 var(--font);letter-spacing:.7px;text-transform:uppercase;color:var(--faint);padding:12px 14px;background:var(--surface-2);border-bottom:1px solid var(--line);white-space:nowrap}
.t td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
.t tr:last-child td{border-bottom:0}
.t tbody tr:hover td{background:color-mix(in srgb,var(--surface-3) 50%,transparent)}
.t .stem{font-weight:600;max-width:340px}
.t .stem small{display:block;font-weight:500;color:var(--faint);font-size:11.5px}
.t .r{text-align:end}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.select,.input{height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:0 12px;font-size:13px;color:var(--text)}
.input{min-width:220px}

/* ---------- Charts ---------- */
.chart{width:100%;height:auto;overflow:visible}
.chart text{fill:var(--faint);font:600 11px var(--font)}
.chart .gl{stroke:var(--grid);stroke-width:1}
.chart .axis{stroke:var(--line-2);stroke-width:1}
.chart .hit{fill:transparent;cursor:crosshair}
.chart .lbl-strong{fill:var(--text);font-weight:700}
.chart-wrap{position:relative}
.tip{position:absolute;pointer-events:none;z-index:5;padding:8px 10px;border-radius:10px;background:#000C2E;color:#fff;font-size:12px;line-height:1.45;box-shadow:0 10px 24px rgba(0,0,0,.25);white-space:nowrap;transform:translate(-50%,calc(-100% - 10px));opacity:0;transition:opacity .12s}
.tip.on{opacity:1}
.tip b{font-weight:800}
.heat{display:grid;gap:3px}
.heat .hc{height:34px;border-radius:5px;background:var(--cbg)}
.heat .hl{font-size:10.5px;color:var(--faint);display:flex;align-items:center}
.hbars{display:grid;gap:12px}
.hbar{display:grid;grid-template-columns:minmax(120px,170px) minmax(0,1fr) 56px;align-items:center;gap:12px;font-size:12.5px}
.hbar .track{height:14px;border-radius:0 4px 4px 0;background:var(--track);overflow:hidden}
[dir="rtl"] .hbar .track{border-radius:4px 0 0 4px}
.hbar .track i{display:block;height:100%;width:var(--v);background:var(--c);border-radius:0 4px 4px 0}
.hbar .v{font-weight:800;text-align:end}
.dist{display:grid;gap:10px}
.dist-row{display:grid;grid-template-columns:30px minmax(0,1fr) 46px;align-items:center;gap:10px;font-size:13px}
.dist-row .l{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--chip);font-weight:800}
.dist-row .track{height:30px;border-radius:8px;background:var(--track);overflow:hidden;position:relative}
.dist-row .track i{position:absolute;inset-block:0;inset-inline-start:0;width:var(--v);background:var(--c,var(--skyline));border-radius:8px;transition:width .5s}
.dist-row .track span{position:absolute;inset-inline-start:12px;top:50%;transform:translateY(-50%);font-weight:700;font-size:12.5px;color:var(--text);z-index:1}

/* ---------- Insight rows ---------- */
.ins{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:var(--r-md);background:var(--surface-2);margin-top:10px}
.ins .ii{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;flex:none;color:#fff;background:var(--c)}
.ins strong{display:block;font-size:13px;line-height:1.35}
.ins small{display:block;font-size:12px;color:var(--muted);line-height:1.5;margin-top:2px}
.ins .act{margin-top:8px}

/* Integration tiles */
.integ{display:flex;flex-direction:column;gap:10px}
.integ .top-r{display:flex;align-items:center;gap:12px}
.integ .lg{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--c);color:#fff;font:900 13px/1 var(--font);flex:none}
.integ h3{margin:0;font:700 15px/1.3 var(--font)}
.integ p{margin:0;color:var(--muted);font-size:12.5px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:12px}
.kv dt{color:var(--faint)} .kv dd{margin:0;font-weight:600;word-break:break-all}
.switch{position:relative;width:40px;height:22px;border-radius:22px;background:var(--track);flex:none;transition:background .15s}
.switch:after{content:'';position:absolute;top:3px;inset-inline-start:3px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:inset-inline-start .15s}
.switch[aria-checked="true"]{background:var(--regal)}
.switch[aria-checked="true"]:after{inset-inline-start:21px}
.svc{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.svc:first-of-type{border-top:0}
.svc strong{display:block;font-size:13px}
.svc small{display:block;font-size:11.5px;color:var(--muted)}
.svc .switch{margin-inline-start:auto}

/* Live host */
.live-hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;align-items:center;border-radius:var(--r-xl);padding:24px 28px;background:linear-gradient(120deg,#000C2E,#00005E 50%,#002EA1);color:#fff;overflow:hidden;position:relative}
.live-hero .code{font:900 clamp(34px,4vw,52px)/1 var(--font);letter-spacing:6px}
.live-hero small{color:#9FB4F0}
.live-hero .stat{display:flex;gap:26px;margin-top:14px;flex-wrap:wrap}
.live-hero .stat b{display:block;font:800 22px/1.1 var(--font)}
.live-qr{width:120px;height:120px;border-radius:14px;background:#fff;padding:10px}
.ring{display:inline-flex;align-items:center;gap:8px;font-weight:800;font-size:12px;letter-spacing:.8px;text-transform:uppercase}
.ring i{width:10px;height:10px;border-radius:50%;background:var(--red);animation:blink 1s infinite}

/* Feed */
.feed{display:grid;gap:0}
.feed-item{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line);font-size:12.5px}
.feed-item:first-child{border-top:0}
.feed-item .fi{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c)}
[data-mode="night"] .feed-item .fi{background:color-mix(in srgb,var(--c) 30%,transparent);color:#fff}
.feed-item strong{font-weight:700}
.feed-item small{display:block;color:var(--faint);font-size:11.5px}
.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:11.5px}

/* Scope switch */
.scope{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px;border-radius:var(--r-md);background:var(--surface);border:1px solid var(--line);margin-bottom:20px}
.scope label{font-size:11px;font-weight:800;letter-spacing:.7px;text-transform:uppercase;color:var(--faint)}
.scope .note{margin-inline-start:auto;font-size:11.5px;color:var(--faint);display:inline-flex;align-items:center;gap:6px}

/* ---------- Modal, drawer, toast, forms ---------- */
.shade{position:fixed;inset:0;z-index:50;background:rgba(0,6,30,.62);backdrop-filter:blur(4px);display:grid;place-items:center;padding:20px;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.modal{width:min(100%,560px);max-height:calc(100vh - 40px);overflow:auto;background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:var(--r-xl);padding:26px;position:relative;box-shadow:0 30px 80px rgba(0,0,0,.4);animation:rise .2s}
.modal.wide{width:min(100%,780px)}
@keyframes rise{from{transform:translateY(12px);opacity:0}}
.modal h2{font:800 22px/1.25 var(--font);margin:6px 0 6px}
.modal>p{color:var(--muted);margin:0 0 16px;font-size:13.5px}
.modal .x{position:absolute;inset-inline-end:16px;top:16px;width:34px;height:34px;border-radius:10px;background:var(--chip);display:grid;place-items:center;color:var(--muted)}
.modal .foot{display:flex;justify-content:flex-end;gap:10px;margin-top:20px;flex-wrap:wrap}
.form{display:grid;gap:14px}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{display:grid;gap:6px}
.field>span{font:700 12px/1.2 var(--font);color:var(--muted)}
.field>span em{font-style:normal;color:var(--red)}
.field input,.field select,.field textarea{width:100%;border-radius:10px;border:1px solid var(--line-2);background:var(--surface-2);padding:10px 12px;font-size:13.5px;color:var(--text)}
.field textarea{min-height:76px;resize:vertical}
.opt-edit{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:center}
.opt-edit input[type=radio]{width:18px;height:18px;accent-color:var(--regal)}
.notice{display:flex;gap:10px;padding:12px 14px;border-radius:12px;background:var(--info-bg);color:var(--info);font-size:12.5px;line-height:1.5}
.notice.warn{background:var(--warn-bg);color:var(--warn)}
.toast{position:fixed;inset-inline-end:24px;bottom:24px;z-index:60;display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:14px;background:#000C2E;color:#fff;font-size:13px;font-weight:600;box-shadow:0 16px 40px rgba(0,0,0,.35);animation:rise .2s;max-width:min(420px,calc(100vw - 32px))}
.toast .ico{color:var(--green)}
.menu{position:absolute;z-index:40;min-width:220px;padding:6px;border-radius:14px;background:var(--surface);border:1px solid var(--line);box-shadow:0 18px 40px rgba(0,0,0,.25)}
.empty{padding:36px;text-align:center;color:var(--muted);border:1.5px dashed var(--line-2);border-radius:var(--r-lg)}

/* ---------- Mobile nav (Image-2 bar with centre FAB) ---------- */
.mnav{display:none}
@media (max-width:1180px){
  :root{--side-w:232px}
  .g-4,.tiles,.stat-tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g-main,.g-main-r{grid-template-columns:minmax(0,1fr)}
  .top-search{max-width:280px}
}
@media (max-width:960px){
  .shell{grid-template-columns:1fr}
  .side{position:fixed;inset-block:0;inset-inline-start:0;width:280px;transform:translateX(-105%);transition:transform .25s;box-shadow:0 0 0 100vmax rgba(0,6,30,0)}
  [dir="rtl"] .side{transform:translateX(105%)}
  .side.open{transform:none;box-shadow:0 0 0 100vmax rgba(0,6,30,.55)}
  .menu-btn{display:grid}
  .l-hero,.g-3,.g-2{grid-template-columns:minmax(0,1fr)}
  .portal{grid-template-columns:1fr}
  .portal-art{min-height:auto;padding-bottom:36px}
  .portal-art h1{margin-top:40px}
  .portal-orbit{opacity:.35}
  .top-search{display:none}
  .content{padding-bottom:110px}
  .mnav{display:grid;grid-template-columns:repeat(5,1fr);align-items:end;position:fixed;inset-inline:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--surface) 96%,transparent);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 6px max(8px,env(safe-area-inset-bottom))}
  .mnav button{display:grid;justify-items:center;gap:2px;padding:6px 0;font-size:10.5px;font-weight:700;color:var(--faint)}
  .mnav button.active{color:var(--primary)}
  [data-mode="night"] .mnav button.active{color:#fff}
  .mnav .fab{width:54px;height:54px;border-radius:50%;margin:-26px auto 0;display:grid;place-items:center;background:linear-gradient(135deg,#0064FF,#0044D5);color:#fff;box-shadow:0 10px 24px rgba(0,68,213,.5);border:4px solid var(--bg)}
  .toast{inset-inline:16px;bottom:96px}
}
@media (max-width:640px){
  .top{height:62px;gap:10px}
  .sync-pill span,.crumbs{display:none}
  .top-actions{margin-inline-start:auto}
  .g-4,.stat-tiles{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .tile{min-height:150px;padding:14px}
  .continue{padding:22px;min-height:300px}
  .continue .art{width:170px;height:160px;opacity:.55}
  .continue .radial{width:64px;height:64px;inset-inline-end:18px;top:18px}
  .continue .radial>div{width:50px;height:50px;font-size:14px}
  .continue h2{max-width:72%}
  .opts{grid-template-columns:1fr}
  .res-stats{grid-template-columns:repeat(2,1fr)}
  .form .two{grid-template-columns:1fr}
  .mrow{grid-template-columns:110px minmax(0,1fr) 44px;gap:8px;font-size:11.5px}
  .hbar{grid-template-columns:100px minmax(0,1fr) 46px}
  .banner .art{opacity:.35}
  .live-hero{grid-template-columns:1fr}
  .live-qr{display:none}
  .card{padding:16px}
  .kpi .val{font-size:24px}
  .sso-row{grid-template-columns:1fr}
  .versus{grid-template-columns:1fr auto 1fr;padding:10px}
  .vs-side small{display:none}
}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.001s!important;animation-iteration-count:1!important;transition:none!important}}
@media (forced-colors:active){.bar>i,.hbar .track i{background:Highlight}}
.chart .cross{stroke:var(--line-2);stroke-width:1;stroke-dasharray:3 3;opacity:0}
.chart .hx:hover .cross{opacity:1}
.spark{width:100%;height:34px}
table.t.wide{min-width:940px}
/* Partially translated prototype: let English runs keep their own direction inside RTL layout */
[dir="rtl"] .content :is(p,h1,h2,h3,small,strong,b,.meta,.nm,.dt,td,th,label span){unicode-bidi:plaintext}
@media (max-width:640px){.portal-orbit{display:none}.portal-art h1{margin-top:28px}}
[data-mode="night"] .toast{background:#fff;color:#000C2E}
[data-mode="night"] .toast .ico{color:#017F1B}

/* =====================================================================
   v2.1 additions: honesty, accessibility, duel and match screens
   ===================================================================== */
html,body{background:var(--bg,#E7F1F3)}
main:focus,[tabindex="-1"]:focus{outline:none}
.skip{position:absolute;inset-inline-start:12px;top:-60px;z-index:100;padding:10px 14px;border-radius:10px;background:#FFCC00;color:#000C2E;font-weight:800;text-decoration:none}
.skip:focus{top:12px}
.demo-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:-8px 0 20px;padding:9px 14px;border-radius:12px;border:1px dashed var(--line-2);background:var(--surface-2);color:var(--muted);font-size:12.5px}
.demo-bar b{color:var(--text)}
.demo-bar .link{margin-inline-start:auto}
.demo-bar.ar-note{margin-top:-12px}
.pill.sim{background:transparent;border:1px dashed currentColor;color:var(--muted)}
.live-hero .pill.sim,.card[style*="#000C2E"] .pill.sim{color:#D3DEFF}
.sync-pill{border:0;cursor:pointer}
.sync-pill.warn{background:var(--warn-bg);color:var(--warn)}
.sync-pill i{animation:none}
.side-scrim{position:fixed;inset:0;z-index:19;background:rgba(0,6,30,.55);border:0}
.portal-note{display:block;margin-top:14px;color:#9FB4F0;font-size:11.5px}
.portal-form .notice.warn{background:#FFF1D6;color:#7A4A00}
.dtable{margin-top:10px;font-size:12.5px}
.dtable summary{cursor:pointer;color:var(--muted);font-weight:700;display:inline-flex;align-items:center;gap:6px;padding:4px 0;border-radius:6px}
.dtable[open] summary{margin-bottom:8px}
.dtable .t td,.dtable .t th{padding:8px 12px}
.mini-h{display:flex;align-items:center;gap:6px;font:800 13px/1.3 var(--font);margin:16px 0 8px;color:var(--text)}
ul.plain{margin:0;padding-inline-start:18px;font-size:13px;color:var(--muted);display:grid;gap:6px}
.nba[aria-disabled="true"]{cursor:default;opacity:.7}
.nba[aria-disabled="true"]:hover{background:var(--chip)}

/* challenges + classmates (QuizUp friend list) */
.ch-list,.friends{display:grid;gap:8px}
.ch-card,.friend{display:grid;grid-template-columns:40px minmax(0,1fr) auto;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;background:var(--row);color:var(--row-text)}
.ch-card strong,.friend strong{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch-card small,.friend small{display:block;font-size:11.5px;color:var(--row-muted)}
.ch-card .avatar,.friend .avatar{width:38px;height:38px;border-color:#fff}
.friend .btn-ghost{color:#0044D5;background:#E9F1FB;border-color:#D7E3EA}
[data-mode="night"] .ch-card .pill{background:#EDF1FA;color:#00005E}
[data-mode="night"] .ch-card .pill.ok{background:#DDF7E6;color:#017F1B}
[data-mode="night"] .ch-card .pill.bad{background:#FDE1E3;color:#B0000F}
[data-mode="night"] .ch-card .pill.info{background:#DDEBFF;color:#0044D5}

/* settings */
.radio-set{border:0;margin:0;padding:0;display:grid;gap:8px}
.radio-row{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line-2);background:var(--surface-2);cursor:pointer}
.radio-row:has(input:checked){border-color:var(--skyline);background:color-mix(in srgb,var(--skyline) 12%,var(--surface-2))}
.radio-row input{width:18px;height:18px;margin-top:3px;accent-color:var(--regal);flex:none}
.radio-row strong{display:block;font-size:13.5px}
.radio-row small{display:block;font-size:12px;color:var(--muted)}

/* quiz chrome */
.q-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.clock{display:inline-flex;align-items:center;gap:2px;min-width:52px;justify-content:center;padding:4px 10px;border-radius:999px;background:var(--surface-2);font:800 14px/1 var(--font);font-variant-numeric:tabular-nums}
.clock.off{font-size:11.5px;color:var(--muted)}
.opt[aria-disabled="true"]{cursor:default}
.opt .tick.wrong{color:var(--bad)}
.order-list{list-style:none;margin:0;padding:0}
.onum{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--chip);font-weight:800;font-size:12px;flex:none}
.ord-fb{margin-inline-start:auto;display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:800;white-space:nowrap}
.ord-fb.ok{color:var(--ok)} .ord-fb.no{color:var(--bad)}
.q-card h2:focus{outline:none}

/* duel (QuizUp head-to-head, Image 7) */
.duel{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:12px;margin:4px 0 14px;padding:12px 14px;border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--line)}
.duel-p{display:flex;align-items:center;gap:10px;min-width:0}
.duel-p.opp{justify-content:flex-end;text-align:end}
.duel-p strong{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.duel-p small{display:block;font-size:11.5px;color:var(--muted)}
.duel-p .avatar{border-color:#4BE38A;border-width:3px}
.duel-p.opp .avatar,.duel-p.opp .ai-av{box-shadow:0 0 0 3px #FF7A86}
.duel-s{font:900 28px/1 var(--font);color:#4BE38A;margin-inline-start:auto;padding-inline:6px}
.duel-p.opp .duel-s{margin-inline-start:0;margin-inline-end:auto;color:#FF7A86}
[data-mode="day"] .duel-s{color:#017F1B} [data-mode="day"] .duel-p.opp .duel-s{color:#B0000F}
.duel-mid{display:grid;justify-items:center;gap:6px}
.duel-mid .p{background:#fff;color:#0044D5;font-weight:800;font-size:13px;border-radius:999px;padding:3px 12px}
[data-mode="day"] .duel-mid .p{background:var(--primary);color:#fff}
.ai-av.lg{width:52px;height:52px;border-radius:50%}
.ai-av.xl{width:84px;height:84px;border-radius:50%}
.ai-av.xl svg{width:38px;height:38px}
.duel-stage{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.is-duel .duel-stage{grid-template-columns:12px minmax(0,1fr) 12px}
.dbar{position:relative;border-radius:999px;background:var(--track);overflow:hidden;min-height:200px}
.dbar i{position:absolute;inset-inline:0;bottom:0;height:var(--v);background:var(--c);border-radius:999px;transition:height .5s cubic-bezier(.2,.8,.2,1)}

/* match results (Image 4–6) */
.match{max-width:760px;margin:0 auto;padding:clamp(22px,4vw,40px) clamp(16px,4vw,40px) 28px;border-radius:28px;background:radial-gradient(520px 260px at 50% -40px,#0A2A9C 0,transparent 70%),#000C2E;color:#fff;text-align:center;box-shadow:0 30px 70px rgba(0,8,50,.35)}
.m-topic{margin:0;font-weight:700;font-size:14px;color:#C9D6FA}
.m-title{margin:6px 0 18px;font:900 clamp(44px,7vw,72px)/1 var(--font);letter-spacing:-1px;background:linear-gradient(90deg,#00C3FF,#4BE38A);-webkit-background-clip:text;background-clip:text;color:transparent}
.m-title.lose{background:linear-gradient(90deg,#FF7A86,#FFCC00);-webkit-background-clip:text;background-clip:text}
.m-title.draw{background:linear-gradient(90deg,#FFCC00,#00C3FF);-webkit-background-clip:text;background-clip:text}
.m-versus{display:flex;align-items:flex-start;justify-content:center;gap:clamp(8px,3vw,26px)}
.m-side{display:grid;justify-items:center;gap:4px;position:relative;width:min(42%,230px)}
.m-side b{font-size:17px;margin-top:6px} .m-side small{font-size:12px;color:#B4C3F0}
.m-av{display:grid;place-items:center;width:108px;height:108px;border-radius:50%;border:6px solid #4BE38A;background:#0A1F78}
.m-av.lose{border-color:#FF7A86} .m-av.draw{border-color:#FFCC00}
.m-av .avatar.xl{width:84px;height:84px;font-size:24px;border:0}
.m-score{position:absolute;top:34px;font:900 30px/1 var(--font)}
.m-side.me .m-score{inset-inline-end:calc(50% + 66px)} .m-side.opp .m-score{inset-inline-start:calc(50% + 66px)}
.m-score.win{color:#4BE38A} .m-score.lose{color:#FF7A86} .m-score.draw{color:#FFCC00}
.m-bolt{align-self:center;margin-top:-30px;color:#fff;opacity:.9} .m-bolt svg{width:30px;height:30px;fill:#fff}
.m-solo{display:grid;align-content:center;gap:4px;width:min(42%,230px)} .m-solo b{font:900 40px/1 var(--font)} .m-solo small{color:#B4C3F0}
.m-bonus{list-style:none;margin:26px 0 8px;padding:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.m-bonus li{display:grid;gap:6px;justify-items:center}
.m-bonus span{font:800 11px/1.2 var(--font);color:var(--c);min-height:28px;display:flex;align-items:flex-end}
.m-bonus b{display:block;width:100%;padding:10px 4px;border:2px solid var(--c);border-radius:10px;color:var(--c);font:900 24px/1 var(--font)}
.m-level{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;margin:18px 0 6px}
.m-ring{width:170px;height:170px}
.m-ring-l{fill:#C9D6FA;font:800 12px var(--font)} .m-ring-n{fill:#fff;font:900 40px var(--font)}
.m-call{display:grid;gap:2px} .m-call.l{justify-items:end;text-align:end} .m-call.r{justify-items:start;text-align:start}
.m-call small{font:800 11px/1.2 var(--font);color:#B4C3F0} .m-call b{font:900 26px/1 var(--font)} .m-call.r b{color:#FF7A86}
.m-up{display:flex;align-items:center;justify-content:center;gap:6px;margin:6px 0 0;color:#FFCC00;font-weight:800}
.m-progress{display:grid;gap:8px;margin:20px auto 0;max-width:520px;text-align:start}
.m-progress>span:first-child{font:800 12.5px/1 var(--font);text-align:center;color:#E7F1F3}
.m-progress .bar{height:14px;background:rgba(255,255,255,.16)}
.m-progress small{color:#B4C3F0;font-size:11.5px;text-align:center}
.m-actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:24px 0 8px}
.m-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:52px;border-radius:12px;background:var(--c);color:#fff;font:800 16px/1 var(--font);transition:filter .15s}
.m-btn.dark{color:#000C2E}
.m-btn:hover{filter:brightness(1.08)}
.m-details{display:inline-flex;align-items:center;gap:6px;margin-top:10px;color:#C9D6FA;font:800 12.5px/1 var(--font);letter-spacing:.4px;padding:8px 12px;border-radius:10px}
.m-details[aria-expanded="true"] svg{transform:rotate(180deg)}
.m-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:14px;text-align:start}
.m-card{background:#0A1F78;border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:16px}
.m-card h3{margin:0 0 8px;font:800 14.5px/1.3 var(--font)}
.m-note{margin:0 0 8px;color:#C2CFF4;font-size:12.5px;line-height:1.55}
.m-row{padding:7px 0;border-top:1px solid rgba(255,255,255,.12);font-size:13px}
.m-card .table-wrap{border-color:rgba(255,255,255,.14)}
.m-card .t th{background:#10298F;color:#C2CFF4;border-color:rgba(255,255,255,.12)}
.m-card .t td{border-color:rgba(255,255,255,.12);color:#fff}
.m-card .t .faint{color:#B4C3F0}
.match :focus-visible{outline-color:#FFCC00}
.match .delta.up{color:#4BE38A} .match .delta.down{color:#FF7A86} .match .delta.flat{color:#B4C3F0}

/* instructor additions */
.actor{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px;border-radius:var(--r-md);background:var(--warn-bg);color:var(--warn);font-size:12.5px;font-weight:700}
.actor small{font-weight:600;opacity:.95}
.actor .select{color:var(--text)}
.ferr{display:flex;align-items:center;gap:6px;color:var(--bad);font-size:12px;font-weight:700}
[aria-invalid="true"]{border-color:var(--bad)!important;box-shadow:0 0 0 1px var(--bad)}
.prev h3{margin:0 0 12px;font:700 17px/1.4 var(--font)}
.prev-opts{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.prev-opts li{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line-2);background:var(--surface-2);font-size:13.5px}
.prev-opts li.is-key{border-color:var(--ok)}
.prev-opts .l{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--chip);font-weight:800;font-size:12px;flex:none}
.prev-opts .pill{margin-inline-start:auto}
.prev-list{margin:0;padding-inline-start:22px;display:grid;gap:6px;font-size:13.5px}
.code-block{margin:14px 0 0;padding:14px;border-radius:12px;background:#000C2E;color:#E7F1F3;font:12px/1.6 ui-monospace,SFMono-Regular,Consolas,monospace;overflow-x:auto}
.live-qr{display:grid;place-items:center;align-content:center;gap:4px;text-align:center;border:2px dashed #ffffff55;background:transparent;color:#C5D3FA;font-size:12px;font-weight:800}
.live-qr small{font-weight:600;font-size:10px;line-height:1.3;color:#9FB4F0}
.feed-item.hl{background:var(--warn-bg);border-radius:10px;padding-inline:8px;outline:2px solid var(--warn)}
@media (max-width:640px){
  .m-bonus{grid-template-columns:repeat(3,minmax(0,1fr))}
  .m-bonus b{font-size:20px}
  .m-av{width:84px;height:84px;border-width:5px} .m-av .avatar.xl,.ai-av.xl{width:66px;height:66px;font-size:19px}
  .m-score{position:static;order:-1;font-size:26px}
  .m-ring{width:136px;height:136px}
  .m-call b{font-size:20px}
  .m-actions{grid-template-columns:1fr}
  .m-grid{grid-template-columns:1fr}
  .duel{grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);padding:10px;gap:6px}
  .duel-p small,.duel-p strong{display:none}
  .duel-p .avatar,.duel-p .ai-av{width:40px;height:40px}
  .duel-s{font-size:22px}
  .is-duel .duel-stage{grid-template-columns:8px minmax(0,1fr) 8px;gap:8px}
  .q-bar .faint{display:none}
}
@media (forced-colors:active){.dbar i,.m-progress .bar>i{background:Highlight}.m-title{color:CanvasText;background:none}}

.m-card .t td.r{white-space:nowrap}
.continue .prog{max-width:min(430px,60%)}
.continue h2{max-width:min(440px,64%)}
.t td.mono{white-space:nowrap}
.t .stem{min-width:300px}
.t td.r:last-child{white-space:nowrap;width:1%}
table.t.wide{min-width:1080px}

/* question music */
.q-mid{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center}
.music-chip{display:inline-flex;align-items:center;gap:8px;padding:5px 12px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);color:var(--text);font:700 12px/1.2 var(--font)}
.music-chip small{color:var(--muted);font-weight:600}
.music-chip .eq{display:inline-flex;align-items:flex-end;gap:2px;height:12px}
.music-chip .eq i{width:3px;height:4px;border-radius:2px;background:var(--muted)}
.music-chip.is-on .eq i{background:#4BE38A;animation:eq .9s ease-in-out infinite}
.music-chip.is-on .eq i:nth-child(2){animation-delay:-.3s}.music-chip.is-on .eq i:nth-child(3){animation-delay:-.6s}
@keyframes eq{0%,100%{height:3px}50%{height:12px}}
@media (prefers-reduced-motion:reduce){.music-chip.is-on .eq i{animation:none;height:10px}}
input[type=range]{width:100%;accent-color:var(--regal)}

function masteryStep(m, ev, ok, diff, hinted){
  const w = Math.max(.12, 1 / (ev + 3)) * (hinted ? .5 : 1);
  const target = ok ? Math.min(100, 70 + diff * 6) : Math.max(0, 34 - diff * 4);
  return Math.round(clamp(m + w * (target - m), 0, 100));
}

function dataTable(cols, rows, caption){

}
function lineChart({ labels, series, h = 220, fmtY = fmt, area = false, title = 'Trend' }){
  const W = 640, pad = { t:16, r:series.length <= 4 && series.length > 1 ? 104 : 16, b:26, l:44 };
  const all = series.flatMap(s => s.data); const max = Math.max(...all) * 1.08; const min = 0;
  const x = i => pad.l + i * (W - pad.l - pad.r) / (labels.length - 1);
  const y = v => pad.t + (h - pad.t - pad.b) * (1 - (v - min) / (max - min));
  let grid = '';
  for (let k = 0; k <= 4; k++){ const v = min + (max - min) * k / 4; grid += `<line class="gl" x1="${pad.l}" x2="${W - pad.r}" y1="${y(v)}" y2="${y(v)}"/><text x="${pad.l - 8}" y="${y(v) + 4}" text-anchor="end">${fmtY(Math.round(v))}</text>`; }
  const xl = labels.map((l, i) => (i % Math.ceil(labels.length / 8) === 0 || i === labels.length - 1) ? `<text x="${x(i)}" y="${h - 6}" text-anchor="middle">${l}</text>` : '').join('');
  const lines = series.map(s => {
    const d = s.data.map((v, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join('');
    const a = area ? `<path d="${d}L${x(s.data.length - 1)},${y(0)}L${x(0)},${y(0)}Z" fill="${s.c}" opacity=".12"/>` : '';
    const last = s.data.length - 1;
    const lab = series.length > 1 && series.length <= 4 ? `<text class="lbl-strong" x="${x(last) + 10}" y="${y(s.data[last]) + 4}">${esc(s.short || s.name)}</text>` : '';
    return `${a}<path d="${d}" fill="none" stroke="${s.c}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${x(last)}" cy="${y(s.data[last])}" r="4" fill="${s.c}" stroke="var(--surface)" stroke-width="2"/>${lab}`;
  }).join('');
  const colW = (W - pad.l - pad.r) / (labels.length - 1);
  const hits = labels.map((l, i) => {
    const tip = `<b>${l}</b>` + series.map(s => `<br><span style="color:${s.c}">●</span> ${esc(s.name)}: <b>${fmtY(s.data[i])}</b>`).join('');
    return `<g class="hx"><line class="cross" x1="${x(i)}" x2="${x(i)}" y1="${pad.t}" y2="${h - pad.b}"/><rect class="hit" x="${x(i) - colW / 2}" y="${pad.t}" width="${colW}" height="${h - pad.t - pad.b}" data-tip="${esc(tip)}" data-x="${x(i) / W}" data-y="${y(Math.max(...series.map(s => s.data[i]))) / h}"/></g>`;
  }).join('');
  const legend = series.length > 1 ? `<div class="legend" style="margin-bottom:8px">${series.map(s => `<span><i style="--c:${s.c}"></i>${esc(s.name)}</span>`).join('')}</div>` : '';
  const last = series.map(s => `${s.name} ${fmtY(s.data[s.data.length - 1])}`).join(', ');
  return `${legend}<div class="chart-wrap"><svg class="chart" viewBox="0 0 ${W} ${h}" role="img" aria-label="${esc(`${title}, ${labels[0]} to ${labels[labels.length - 1]}. Latest: ${last}. Data table below.`)}">${grid}<line class="axis" x1="${pad.l}" x2="${W - pad.r}" y1="${y(0)}" y2="${y(0)}"/>${xl}${lines}${hits}</svg><div class="tip" aria-hidden="true"></div></div>
    ${dataTable(['Period', ...series.map(s => s.name)], labels.map((l, i) => [l, ...series.map(s => fmtY(s.data[i]))]), title)}`;
}
function barChart({ labels, data, c = 'var(--skyline)', h = 200, fmtV = fmt, colors, title = 'Bar chart', unit = 'Value' }){
  const W = 640, pad = { t:22, r:10, b:26, l:10 };
  const max = Math.max(...data, 1) * 1.12; const n = data.length; const slot = (W - pad.l - pad.r) / n; const bw = Math.min(46, slot * .56);
  const y = v => pad.t + (h - pad.t - pad.b) * (1 - v / max);
  const bars = data.map((v, i) => {
    const cx = pad.l + slot * i + slot / 2, top = y(v), base = h - pad.b, col = colors ? colors[i] : c;
    const r = Math.min(4, (base - top) / 2);
    const path = `M${cx - bw / 2},${base}V${top + r}Q${cx - bw / 2},${top} ${cx - bw / 2 + r},${top}H${cx + bw / 2 - r}Q${cx + bw / 2},${top} ${cx + bw / 2},${top + r}V${base}Z`;
    return `<path d="${path}" fill="${col}"/><text x="${cx}" y="${top - 6}" text-anchor="middle" class="lbl-strong">${fmtV(v)}</text><text x="${cx}" y="${h - 6}" text-anchor="middle">${labels[i]}</text><rect class="hit" x="${cx - slot / 2}" y="${pad.t}" width="${slot}" height="${base - pad.t}" data-tip="<b>${esc(labels[i])}</b><br>${fmtV(v)}" data-x="${cx / W}" data-y="${top / h}"/>`;
  }).join('');
  return `<div class="chart-wrap"><svg class="chart" viewBox="0 0 ${W} ${h}" role="img" aria-label="${esc(`${title}: ${labels.map((l, i) => `${l} ${fmtV(data[i])}`).join(', ')}`)}">${bars}<line class="axis" x1="${pad.l}" x2="${W - pad.r}" y1="${h - pad.b}" y2="${h - pad.b}"/></svg><div class="tip" aria-hidden="true"></div></div>
    ${dataTable(['Category', unit], labels.map((l, i) => [l, fmtV(data[i])]), title)}`;
}
function spark(data, c = 'var(--skyline)'){
  const W = 120, H = 34, max = Math.max(...data), min = Math.min(...data);
  const d = data.map((v, i) => `${i ? 'L' : 'M'}${(i * W / (data.length - 1)).toFixed(1)},${(H - 3 - (H - 6) * (v - min) / (max - min || 1)).toFixed(1)}`).join('');
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true"><path d="${d}" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg>`;
}
function kpi({ label, value, unit = '', delta, dir = 'up', def, icon, c, sparkData }){
  return `<div class="card kpi">${icon ? `<span class="kpi-ico" style="--c:${c || 'var(--regal)'}">${ic(icon)}</span>` : ''}<span class="lbl">${label}</span><span class="val num">${value}${unit ? `<small>${unit}</small>` : ''}</span>${delta ? `<span class="delta ${dir}">${dir !== 'flat' ? ic(dir === 'up' ? 'up' : 'down', 'ico-sm') : ''}${delta}</span>` : ''}${def ? `<span class="def">${def}</span>` : ''}${sparkData ? `<div class="spark">${spark(sparkData, c)}</div>` : ''}</div>`;
}

/* ------------------------------------------------------------ dialogs
   Named, focus-contained, background-inert dialogs that return focus (audit F11). */
const MODALS = {};
const mhead = (eyebrow, title, eyebrowStyle = '') => `<div class="eyebrow" ${eyebrowStyle ? `style="${eyebrowStyle}"` : ''}>${eyebrow}</div><h2 id="mdl-title">${title}</h2>`;

}
const FOCUSABLE = 'button:not([disabled]),[href],input:not([disabled]),select:not([disabled]),textarea:not([disabled]),summary,[tabindex]:not([tabindex="-1"])';
const KEY_ATTRS = ['act','view','id','modal','mode','course','lo','i','k','v','step','input','draft','pos','d','cid','pid','status','uid'];
function keyOf(el){
  if (!el || el === document.body || !el.closest) return null;
  if (el.id) return '#' + CSS.escape(el.id);
  const parts = KEY_ATTRS.filter(a => el.dataset && el.dataset[a] !== undefined).map(a => `[data-${a}="${CSS.escape(el.dataset[a])}"]`);
  return parts.length ? el.tagName.toLowerCase() + parts.join('') : null;
}
function focusKey(key){
  if (!key) return false;
  try { const el = document.querySelector(key); if (el && !el.closest('[inert]')){ el.focus({ preventScroll:true }); return true; } } catch {}
  return false;
}

/* ------------------------------------------------------- toast (independent)

function toast(msg){

  root.innerHTML = `<div class="toast">${ic('check')}<span></span></div>`;

/* ----------------------------------------------------------------- render */
function applyDoc(){

}
let lastModal = null;
function render(){
  applyDoc();
  const app = document.getElementById('app'), mroot = document.getElementById('modal-root');
  const ae = document.activeElement;
  const key = keyOf(ae);
  const sel = ae && 'selectionStart' in ae ? [ae.selectionStart, ae.selectionEnd] : null;
  const scrollY = window.scrollY;
  if (S.modal && !lastModal) S.modalReturn = key;
  let html;
  if (!S.role) html = `<a class="skip" href="#main" data-act="skip">${t('Skip to content')}</a>${portal()}`;
  else {
    const fn = S.view === 'quiz' ? quizView : (VIEWS[S.role][S.view] || VIEWS[S.role].home);
    html = `<a class="skip" href="#main" data-act="skip">${t('Skip to content')}</a><div class="strip"></div><div class="shell">${sidebar()}<div class="main">${topbar()}<main class="content" id="main" tabindex="-1">${demoBar()}${fn()}</main></div>${mobileNav()}</div>`;
  }
  app.innerHTML = html;
  mroot.innerHTML = S.modal && MODALS[S.modal] ? MODALS[S.modal]() : '';
  app.inert = !!(S.modal && MODALS[S.modal]);
  const opened = S.modal && lastModal !== S.modal, closed = !S.modal && lastModal;
  lastModal = S.modal && MODALS[S.modal] ? S.modal : null;
  if (S.focusNext){ const k = S.focusNext; S.focusNext = null; if (!focusKey(k)) focusKey(key); }
  else if (opened){
    const m = mroot.querySelector('.modal');
    const first = m && (m.querySelector('[data-autofocus]') || [...m.querySelectorAll(FOCUSABLE)].find(e => !e.classList.contains('x')));
    (first || m)?.focus({ preventScroll:true });
  } else if (closed){ if (!focusKey(S.modalReturn)) document.getElementById('main')?.focus({ preventScroll:true }); S.modalReturn = null; }
  else if (key && focusKey(key)){
    const el = document.activeElement; if (sel && el && 'setSelectionRange' in el){ try { el.setSelectionRange(sel[0], sel[1]); } catch {} }

   It plays continuously through the session, including between questions, and stops on results or exit. */
'use strict';

/* Optional file-based tracks: add <script type="text/plain" id="trk-…"> elements with licensed audio to use them; otherwise the original synth loops play. */
const FILE_TRACKS = [

    chords:[[57,60,64],[53,57,60],[52,55,60],[55,59,62]],

    kick:'x...x...x...x...', snare:'....x.......x...', hat:'x.x.x.x.x.x.x.x.',

    chords:[[50,54,57],[51,55,58],[50,54,57],[48,51,55]],

    bass:'x.....x...x.....', arp:'',
    mel:[74,null,75,null,78,null,79,null,81,null,79,78,75,null,74,null, 74,null,72,null,70,null,69,null,70,72,74,null,75,74,null,null] },
  { name:'Lab Groove', mood:'Funky', bpm:108, lead:'square', bassWave:'square',
    chords:[[50,53,57,60],[55,59,62,65],[50,53,57,60],[57,60,64]],
    kick:'x..x..x...x..x..', snare:'....x.......x..x', hat:'xxxxxxxxxxxxxxxx',
    bass:'x..o..x.x.o..x..', arp:'..0...2...1...3.' },
  { name:'Quiet Library', mood:'Ambient', bpm:76, lead:'sine', bassWave:'sine',
    chords:[[48,52,55,59],[45,48,52,55],[41,45,48,52],[43,47,50,55]],
    kick:'', snare:'', hat:'',
    bass:'x...............', arp:'0...2...3...1...', pad:.07 },
  { name:'Arena Rush', mood:'Driving', bpm:140, lead:'sawtooth', bassWave:'sawtooth',
    chords:[[55,58,62],[51,55,58],[58,62,65],[53,57,60]],
    kick:'x...x...x...x...', snare:'....x.......x...', hat:'.x.x.x.x.x.x.x.x',
    bass:'xoxoxoxoxoxoxoxo', arp:'0120012001200123' },
];

const Music = (() => {
  let ctx = null, master = null, noiseBuf = null, bus = null, timer = null;
  let track = null, step = 0, nextTime = 0, last = -1, status = 'off';
  let session = null, startedAt = 0, startOffset = 0;   // session = { track, n, offset, step }
  let src = null, token = 0, fileOK = FILE_TRACKS.some(t => document.getElementById('trk-' + t.key));
  const cache = new Map();                                    // key -> Promise<AudioBuffer>, at most 2 kept
  function load(key){
    if (!cache.has(key)){
      const txt = document.getElementById('trk-' + key).textContent.trim(), bin = atob(txt), u = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
      cache.set(key, ctx.decodeAudioData(u.buffer));
      while (cache.size > 2) cache.delete(cache.keys().next().value);
    } else { const p = cache.get(key); cache.delete(key); cache.set(key, p); }
    return cache.get(key);
  }
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);
  const prefs = () => (S.lp.music ||= { on:true, vol:.5 });
  function init(){
    if (ctx) return true;
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return false;
    ctx = new AC();
    const comp = ctx.createDynamicsCompressor(); comp.threshold.value = -18; comp.ratio.value = 4;
    master = ctx.createGain(); master.gain.value = prefs().vol * .6;
    master.connect(comp); comp.connect(ctx.destination);
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    document.addEventListener('visibilitychange', () => { if (!ctx) return; if (document.hidden) ctx.suspend(); else if (status === 'playing') ctx.resume(); });
    return true;
  }
  function env(node, t, peak, att, dur){ node.gain.setValueAtTime(0.0001, t); node.gain.linearRampToValueAtTime(peak, t + att); node.gain.exponentialRampToValueAtTime(0.0001, t + dur); }
  function tone(type, midi, t, dur, peak, cutoff){
    const o = ctx.createOscillator(), g = ctx.createGain(); o.type = type; o.frequency.value = hz(midi);
    let out = o; if (cutoff){ const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = cutoff; o.connect(f); out = f; }
    out.connect(g); g.connect(bus); env(g, t, peak, Math.min(.02, dur / 4), dur); o.start(t); o.stop(t + dur + .05);
  }
  function noise(t, dur, peak, type, freq){
    const s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    s.buffer = noiseBuf; f.type = type; f.frequency.value = freq; s.connect(f); f.connect(g); g.connect(bus);
    env(g, t, peak, .002, dur); s.start(t); s.stop(t + dur + .02);
  }
  function kick(t, low){
    const o = ctx.createOscillator(), g = ctx.createGain(); o.type = 'sine';
    o.frequency.setValueAtTime(low ? 110 : 150, t); o.frequency.exponentialRampToValueAtTime(low ? 55 : 45, t + .14);
    o.connect(g); g.connect(bus); env(g, t, low ? .4 : .55, .003, .22); o.start(t); o.stop(t + .3);
  }
  function playStep(s, t){
    const T = track, sec = 60 / T.bpm / 4, i = s % 16, bars = T.chords.length, chord = T.chords[Math.floor(s / 16) % bars];
    if (i === 0) chord.forEach(m => tone('triangle', m, t, sec * 16, T.pad || .045, 1600));
    const b = T.bass[i]; if (b === 'x' || b === 'o') tone(T.bassWave, chord[0] - 24 + (b === 'o' ? 12 : 0), t, sec * 1.8, .16, 700);
    const a = T.arp[i]; if (a && a !== '.'){ const d = +a; tone(T.lead, chord[d % chord.length] + 12 + Math.floor(d / chord.length) * 12, t, sec * (T.lead === 'sine' ? 6 : 1.4), T.lead === 'sine' ? .07 : .05, 3200); }
    if (T.mel){ const m = T.mel[s % T.mel.length]; if (m) tone(T.lead, m, t, sec * 1.9, .07, 2600); }
    if (T.kick[i] === 'x') kick(t, T.tek);
    if (T.snare[i] === 'x') noise(t, .14, .16, 'bandpass', 1800);
    if (T.hat[i] === 'x') T.tek ? noise(t, .07, .12, 'bandpass', 3200) : noise(t, .035, .045, 'highpass', 7000);
  }
  function schedule(){
    const sec = 60 / track.bpm / 4, loop = track.chords.length * 16 * (track.mel ? Math.max(1, track.mel.length / 16 / track.chords.length) : 1);
    while (nextTime < ctx.currentTime + .12){ playStep(step, nextTime); nextTime += sec; step = (step + 1) % loop; }  // loops seamlessly
  }
  function halt(next){
    if (session && status === 'playing'){                    // remember where the session track is
      if (src) session.offset = startOffset + (ctx.currentTime - startedAt);

    }
    clearInterval(timer); timer = null; token++;
    if (src){ try { src.stop(ctx.currentTime + .08); } catch {} src = null; }
    if (bus && ctx){ const old = bus; old.gain.setTargetAtTime(0, ctx.currentTime, .04); setTimeout(() => old.disconnect(), 400); }
    bus = null; status = next; refresh();
  }
  function refresh(){ const el = document.getElementById('music-status'); if (!el) return; const had = document.activeElement === el; el.outerHTML = musicChip(); if (had) document.getElementById('music-status')?.focus(); }
  return {
    /* plays the session track; picks a new random one when a session starts */
    play(){
      if (!prefs().on){ status = 'off'; refresh(); return; }
      if (!init()){ status = 'unsupported'; refresh(); return; }
      if (session && bus && (status === 'playing' || status === 'loading')) return;   // keep going between questions
      if (bus) halt('paused');
      ctx.resume?.();
      if (!session){
        const list = fileOK ? FILE_TRACKS : TRACKS;
        let n; do { n = Math.floor(Math.random() * list.length); } while (list.length > 1 && n === last);
        last = n; session = { track:list[n], offset:0, step:0 };
      }
      track = session.track;
      bus = ctx.createGain(); bus.gain.value = 0; bus.connect(master); bus.gain.setTargetAtTime(1, ctx.currentTime, .05);
      if (fileOK && track.key){

        return;
